# 低价摊大饼策略 — NBO 最优配置
# ============================================================
# 基于 48 组参数精扫的最优组合
# 数据范围: 2022-01-04 ~ 2024-12-31 (726 交易日)
# 成交模型: next_bar_open (NBO)
#
# 验证指标 (NBO):
#   年化收益: 3.78% | 最大回撤: 18.35%
#   Sharpe: 0.210 | Calmar: 0.206
#   交易次数: 1402
#
# 策略逻辑:
#   买入最低价的前 K 只可转债, 等权持有
#   面值回归效应 + 下有保底 (≈100 元面值)
# ============================================================

name: "low_price"
description: >
  低价摊大饼策略 — 买入价格最低的可转债并等权持有。
  利用可转债面值保底特性, 适合与其他策略组合使用 (信号来源不同, 提供分散化收益)。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "low_price"
  params:
    top_k: 40                     # 40只: 良好分散度
    rebalance_days: 2             # 每2天轮动: reb=2 最优 (3.78% vs reb=3 的 2.30%)
    max_price: 110.0              # ★ 110 元上限显著优于 115 (3.78% vs 0.87%)
    min_turnover: 100.0           # 最低成交额 100 万
    min_issue_size: 0.0            # 发行规模下限 (静态字段, 无前视偏差)
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.20           # 20% 止损线

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/low_price"

# ------ 报告 ------
report:
  benchmark: null
  custom_benchmark: "000832.CSI"

# ============================================================
# 验证结果
# ============================================================
verified_metrics:
  annual_return_pct: 3.78
  max_drawdown_pct: 18.35
  sharpe: 0.210
  calmar: 0.206
  total_trades: 1402

# ============================================================
# 已知风险
# ============================================================
risks:
  - "收益有限: 年化仅 3.78%, 低于多数策略"
  - "min_remain_size 已改用 issue_size (IPO静态字段), PIT偏差已消除 (R94修复确认)"
  - "适合作为组合分散化部件, 不建议独立使用"
