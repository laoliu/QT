# A 股价值反转策略 — 全市场 10 年回测
# 核心逻辑：短期反转（散户过度反应 → 反弹）+ 价值锚定（低 PE → 估值回归）
# 学术基础：Jegadeesh (1990) STR, Lehmann (1990), 广发金工反转因子系列
# 关键创新：
#   1) 用 STR 5 日反转（A 股 IC 4-7%）替代传统中期动量
#   2) 周频调仓（5 天），匹配反转因子最佳频率
#   3) 全市场 50 亿+ 选股，兼顾容量

cost_model:
  commission: {min_fee: 5.0, rate: 0.0001}
  stamp_tax: {sell_rate: 0.0005}
  transfer_fee: {rate: 1.0e-05}

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.08
    lot_size: 100
    opening_volume_fraction: 0.10

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments: {asset_type: stock, boards: [A]}
  region: CN

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 40.0
  fallback_bps: 10.0
  max_bps: 60.0

strategy:
  name: balanced_multifactor
  parameters:
    top_k: 30
    rebalance_days: 5           # 周频调仓（反转因子最佳频率）
    min_mv: 500000.0            # 50 亿
    max_mv: 50000000.0          # 不限上界
    min_price: 5.0
    max_price: 500.0
    min_turnover: 1000.0
    min_listed_days: 120
    buffer_k: 10

    # 核心因子配比 — 反转+价值+质量+低波
    weight_str: 0.30            # 短期反转（A 股 IC 4-7%，行为因子）
    weight_value: 0.25          # EP 价值（IC 3-5%）
    weight_quality: 0.25        # ROE 质量
    weight_volatility: 0.20     # 低波动

    # 关闭的因子
    weight_momentum: 0.0
    weight_size: 0.0            # 另一策略用
    weight_turnover: 0.0
    weight_dividend: 0.0
    weight_earnings_growth: 0.0

    # 因子参数
    str_lookback: 5             # 5 日反转
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe

    # 风控
    stop_loss_pct: 0.12
    trailing_stop_pct: 0.08
    inverse_vol_weighting: true
    max_single_pct: 0.06
    cash_reserve_pct: 0.03

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
