# CSI1000 滚动重训管线配置 (O5)
# 与 retrain_csi2000.yml 结构一致，universe 改为 csi1000
# ============================================================

retrain:
  universe: csi1000
  model_type: lightgbm
  train_start: "2017-01-03"
  train_years: 3
  predict_months: 3
  forward_days: 5
  deep_fundamental: true

  model_dir: "models/ml_csi1000_lgb_fund"
  archive_dir: "models/_archive"

  triggers:
    psi_threshold: 0.20
    max_age_days: 90
    ic_threshold: 0.08
    ic_improvement_min: -0.005

  lgb_params:
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
