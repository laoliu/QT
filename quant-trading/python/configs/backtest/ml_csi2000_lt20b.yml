# ============================================================
# CSI2000 <20亿 市值分层 ML 策略 — P0 生产化配置
# ============================================================
# CF-035: 与 CSI300>=200B 相关仅 0.475，最优分散化配对
# CF-027: CSI2000 v3 容量 <=500万
# CF-028: CSI2000 alpha 完全来自 <20亿市值
# 模型: ml_csi2000_lgb_p5v (24 folds, double_ensemble, IC=0.148)
# 市值过滤: max_mv=200,000万元 (<20亿流通市值)
# 小盘股滑点较高: base_bps=8, impact_coeff=60
# ============================================================

cost_model:
  commission:
    min_fee: 5.0
    rate: 0.0000854
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05   # 小盘参与率更低
    lot_size: 100
    opening_volume_fraction: 0.1

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 399303.SZ
  region: CN

report:
  benchmark: 399303.SZ
  metrics:
    - annual_return
    - max_drawdown
    - sharpe
    - calmar
    - turnover
    - positions_count_distribution
    - cost_impact
  output_dir: output/ml_csi2000_lt20b
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.5
  max_sector_pct: 0.15
  max_single_position_pct: 0.03   # 小盘更分散
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  circuit_breaker_enabled: false
  # R94: death spiral disabled
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2020-01-17'  # 模型 OOS 起始日
  end_date: '2025-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact
  base_bps: 8.0            # 小盘股流动性差
  impact_coeff: 60.0        # 小盘冲击成本高
  fallback_bps: 15.0
  max_bps: 100.0

strategy:
  name: ml_factor
  parameters:
    check_index_member: false
    top_k: 50
    rebalance_days: 5
    max_mv: 200_000.0       # <20亿流通市值（万元）
    min_mv: 30_000.0        # >=3亿最低门槛
    min_price: 3.0
    max_price: 300.0
    min_turnover: 500.0
    min_listed_days: 120
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 15
    cash_reserve_pct: 0.03
    max_single_pct: 0.03
    # --- ML ---
    model_objective: regression
    model_type: double_ensemble
    model_path: models/ml_csi2000_lgb_p5v
    oos_predictions_path: models/ml_csi2000_lgb_p5v/oos_predictions.parquet
    train_years: 3
    predict_months: 3
    forward_days: 5
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    purge_days: 10
