# CBClausePlay v1 — 条款博弈可转债策略
# ============================================================
# 利用回售条款和到期催化效应选股。理论基础：
#   - 正股价接近回售触发线(≤70%转股价) → 发行人下修概率 70-80%
#   - 距到期 1-3 年 → 催化事件频率高峰（下修/促转/回购）
#   - 两者叠加 = 高确定性 alpha 来源
#
# 因子矩阵（4+1 因子，2 层）：
#   Layer 1 (CB本体): price(0.20) + premium(0.15)
#   Layer 3 (条款博弈): putback(0.30) + maturity_catalyst(0.25)
#   Weak: issue_size(0.10)
#
# 与 F1 策略对比：
#   - cb_stock_quality: Layer 1+2（正股传导）
#   - cb_gamma_convexity: Layer 1 + Delta结构
#   - cb_clause_play: Layer 1 + Layer 3（条款博弈）← 本策略
# ============================================================

name: "cb_clause_play_v1_7y"
description: >
  条款博弈可转债策略 v1。
  选择低价+低溢价+回售触发线附近+到期催化高峰期的可转债。
  4+1 因子：putback(0.30) + maturity_catalyst(0.25) + price(0.20)
  + premium(0.15) + issue_size(0.10, 弱)。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_clause_play"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 130.0
    max_issue_size: .inf
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.20
    lot_size: 10
    # --- 次新过滤 ---
    min_age_days: 30
    # --- 溢价率过滤 ---
    max_premium: 50.0
    # --- 4+1 因子权重 ---
    weight_price: 0.20
    weight_premium: 0.15
    weight_putback: 0.30
    weight_maturity: 0.25
    weight_issue_size: 0.10
    # --- 回售参数 ---
    putback_trigger_ratio: 0.70

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.12
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/cb_clause_play_v1_7y"
