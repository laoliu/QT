# DoubleLow+ v2 优化 — 进一步放大规模因子+收紧溢价率
# 从 v1(28.47%) 优化：更大weight_size, 更宽max_premium

name: "double_low_plus_v2_7y"

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "double_low_plus"
  params:
    top_k: 5
    rebalance_days: 1
    max_price: 140.0
    max_issue_size: 15000.0        # 更小规模(1.5亿)
    min_issue_size: 300.0
    min_turnover: 8.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    max_premium: 55.0
    lookback: 20
    bb_k: 2.0
    # 极端聚焦规模因子
    weight_price: 0.10
    weight_premium: 0.10
    weight_size: 0.35
    weight_age: 0.05
    weight_mean_reversion: 0.25
    weight_rating: 0.15
    min_candidates: 3

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42

output_dir: "output/double_low_plus_v2_7y"
