# DoubleLow+ v6 — 整改版（专家组建议）
# ============================================================
# 变更：top_k 6→10, rebalance_days 1→3, weight_size 0.35→0.20
# 原因：降低集中度(原则C)，降低规模因子主导(原则A)
# ============================================================

name: "double_low_plus_v6_7y"
description: >
  双低增强策略 v6。根据专家组评审整改：
  - top_k 从 6 上调至 10（降低集中度风险）
  - rebalance_days 从 1 上调至 3（降低换手率和流动性冲击）
  - weight_size 从 0.35 下调至 0.20（降低规模因子主导、减少数据挖掘嫌疑）
  - weight_price/weight_premium 恢复为主导权重（回归双低本质）

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "double_low_plus"
  params:
    top_k: 10
    rebalance_days: 3
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 500.0
    min_turnover: 10.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    max_premium: 60.0
    lookback: 20
    bb_k: 2.0
    # 整改后因子权重：回归双低本质 + 适度小盘 + 均值回归
    weight_price: 0.20
    weight_premium: 0.20
    weight_size: 0.20
    weight_age: 0.05
    weight_mean_reversion: 0.20
    weight_rating: 0.15
    min_candidates: 3

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.15
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/double_low_plus_v6_7y"
