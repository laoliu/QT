# 多策略 Paper Trading 配置
# 用法: python -m aipha paper --config configs/paper/cb_multi_strategy.yml
# 同时运行 small_size + new_bond 策略，各分配 50% 资金

paper_engine:
  # 多策略模式：使用 multi_strategy 配置
  strategy_name: "multi_strategy"  # 特殊值，触发多策略模式

  # 标的列表（合并所有策略候选池，或启用 universe）
  symbols:
    - "127045"
    - "128054"
    - "113050"
    - "123046"
    - "127036"
    - "123039"
    - "123027"
    - "113060"
    - "123057"
    - "128109"
    - "123044"
    - "128035"
    - "127037"
    - "113049"
    - "123050"
    - "123033"
    - "127038"
    - "128108"
    - "113055"
    - "123029"

  # 数据源
  market_type: "convertible_bond"
  poll_interval: 3.0
  bar_interval_sec: 60

  # 资金与交易规则（总资金，由各策略按权重分配）
  initial_capital: 1000000.0
  lot_size: 10
  t_plus_n: 0
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  slippage_bps: 5.0

  # 状态持久化
  state_dir: "data/paper_state/multi_strategy"
  state_file: "state.json"
  audit_log_dir: "logs/paper/multi_strategy"

  # 动态标的池（可选）
  universe:
    enabled: false
    max_price: 150.0
    min_amount: 0.5
    refresh_interval_sec: 3600

  # 监控告警
  monitoring_enabled: true
  alert_drawdown_threshold: 0.10
  alert_daily_loss_threshold: 0.03
  alert_data_stale_seconds: 120.0
  alert_inactivity_minutes: 120.0

  # 指标收集
  metrics_enabled: true
  metrics:
    output_dir: "data/metrics/multi_strategy"
    write_interval_sec: 60

# 多策略配置
multi_strategy:
  total_capital: 1000000
  lot_size: 10
  t_plus_n: 0
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  slippage_bps: 5.0
  strategies:
    - name: small_size
      weight: 0.5
      max_drawdown: 0.15
      params:
        top_k: 15
        rebalance_days: 5
        max_price: 120.0
        max_issue_size: 30000.0
        min_issue_size: 5000.0
        min_turnover: 50.0
        min_days_to_maturity: 60
        stop_loss_pct: 0.15
        lot_size: 10

    - name: new_bond
      weight: 0.5
      max_drawdown: 0.15
      params:
        top_k: 10
        rebalance_days: 5
        max_price: 130.0
        min_turnover: 50.0
        min_days_to_maturity: 30
        stop_loss_pct: 0.15
        lot_size: 10
