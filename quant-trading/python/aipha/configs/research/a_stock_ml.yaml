# Canonical low-frequency A-share research defaults.
# Input market/feature panels are frozen local Parquet snapshots. Historical
# provider adapters may only populate these snapshots; they do not silently
# fall back during backtests.
data:
  provider: tushare_pit
  # Conflicting values with identical report/publication dates become null
  # metric events; the signed snapshot and report disclose every quarantine.
  financial_conflict_policy: quarantine
  snapshot_dir: data/snapshots
  frequency: 1d
  # The research snapshot stores raw prices plus a factor known on each
  # trade date. Do not replace this with a final-history qfq series.
  adjust: point_in_time

universe:
  base_index: CSI500
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 252

features:
  version: cn_equity_v1
  groups: [value, quality, momentum, volatility, liquidity, technical]
  # Only registered columns in enabled groups enter the model. Missing groups
  # are disclosed in the report; unknown numeric columns are excluded.
  # Register custom causal factors explicitly, e.g. {my_alpha: momentum}.
  column_groups: {}

label:
  type: forward_return_rank
  horizon_days: 20
  skip_days: 1
  price_field: close

model:
  type: lightgbm_ranker
  objective: lambdarank
  train_years: 3
  test_months: 1
  purge_days: 20
  n_estimators: 300

portfolio:
  rebalance: monthly
  top_k: 30
  max_position_weight: 0.05
  max_industry_weight: 0.20
  # Absolute NAV-weighted z-score budgets on the signal-date eligible universe.
  # Opt in with e.g. {log_market_cap: 0.30, momentum_20: 0.50}.
  max_style_exposure: {}
  max_daily_turnover: 0.30
  initial_capital: 1000000

cost:
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_bps: 15.0

execution:
  mode: paper
