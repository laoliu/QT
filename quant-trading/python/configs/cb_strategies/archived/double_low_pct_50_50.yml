# 双低百分位策�?�?等权 (50:50)

# 百分位归一�?等权，兼顾连续性和鲁棒�?


name: "double_low_pct_50_50"

description: >-

  双低百分位策略：价格和溢价率百分位归一化后50:50加权�?


data:

  source: "tushare_cb"

  start_date: "2018-01-01"

  end_date: "2024-12-31"

  frequency: "1d"

  adjust: "none"

  cache_dir: "data/cache/cb_tushare"



strategy:

  name: "double_low_percentile"

  params:

    top_k: 20

    rebalance_days: 5

    max_price: 130.0

    max_premium: 50.0

    min_turnover: 20.0

    min_days_to_maturity: 30

    exclude_st: true

    stop_loss_pct: 0.10

    lot_size: 10

    price_weight: 0.50

    premium_weight: 0.50

    use_cb_value: false



fill_model:

  name: "next_bar_open"

  volume_constraint:

    max_participation_rate: 0.10
    opening_volume_fraction: 0.15

    lot_size: 10



cost:

  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond

  commission_min: 5
  stamp_tax_rate: 0.0

  transfer_fee_rate: 0.0

  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限



initial_capital: 500000.0

lot_size: 10

t_plus_n: 0



random_seed: 42



output_dir: "output/dl_pct_50_50"

