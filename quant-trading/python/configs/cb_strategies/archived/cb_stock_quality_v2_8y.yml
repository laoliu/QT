# 正股质量增强 v2 回测配置 (8因子: 价格+溢价+ROE+EP+波动+现金流+盈利稳定+增长)
# 基于 cb_stock_quality (sq_v4b) 拓展，增加正股现金流/盈利稳定性/增长因子
# 回测区间: 2018-01-02 ~ 2025-12-31 (≥7 年，满足 §5.6 CB 主评估期)

name: "cb_stock_quality_v2_8y"
description: >
  正股质量 v2 — 8因子模型（CB层 + 正股基本面 + 新增现金流/盈利稳定/增长）。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2025-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality_v2"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 150.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    stop_loss_pct: 0.25
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 80.0
    weight_price: 0.15
    weight_premium: 0.15
    weight_stock_roe: 0.15
    weight_stock_ep: 0.10
    weight_stock_vol: 0.10
    weight_cash_flow: 0.15
    weight_earnings_stability: 0.10
    weight_growth: 0.10
    vol_lookback: 60
    use_stock_bridge: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_stock_quality_v2_8y"

report:
  benchmark: "000300.SH"
