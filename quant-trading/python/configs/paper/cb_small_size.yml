# Paper Trading 配置 — CB small_size 策略
# 用法: python -m aipha paper --config configs/paper/cb_small_size.yml
# OOS 验证 (2025-02): IS 10.40% → OOS 14.88%, Sharpe=0.878

paper_engine:
  # 策略
  strategy_name: "small_size"

  # 策略参数（与 configs/cb_strategies/small_size.yml 对齐）
  strategy_params:
    top_k: 15
    rebalance_days: 5
    max_price: 120.0
    max_issue_size: 30000.0      # 万元 (3亿以下)
    min_issue_size: 5000.0       # 万元
    min_turnover: 50.0
    min_days_to_maturity: 60
    stop_loss_pct: 0.15
    lot_size: 10

  # 标的列表 — 覆盖候选池（小规模 CB，定期更新）
  symbols:
    - "127045"
    - "128054"
    - "113050"
    - "123046"
    - "127036"
    - "123039"
    - "123027"
    - "113060"
    - "123057"
    - "128109"
    - "123044"
    - "128035"
    - "127037"
    - "113049"
    - "123050"
    - "123033"
    - "127038"
    - "128108"
    - "113055"
    - "123029"

  # 数据源
  market_type: "convertible_bond"
  poll_interval: 3.0        # 轮询间隔（秒）
  bar_interval_sec: 60      # K线周期（秒）

  # 资金与交易规则
  initial_capital: 500000.0
  lot_size: 10               # 可转债最小交易单位（张）
  t_plus_n: 0                # T+0
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5        # 最低佣金
  stamp_tax_rate: 0.0        # 可转债免印花税
  slippage_bps: 5.0          # 滑点 5 bps (与回测一致)

  # 状态持久化
  state_dir: "data/paper_state/small_size"
  state_file: "state.json"
  audit_log_dir: "logs/paper/small_size"

  # 动态标的池（启用后自动替代静态 symbols）
  universe:
    enabled: false            # 设为 true 启用动态发现
    max_price: 150.0
    min_amount: 0.5           # 最小剩余规模（亿元）
    exclude_called: true
    refresh_interval_sec: 3600

  # 交易监控告警
  monitoring_enabled: true
  alert_drawdown_threshold: 0.08    # 8% 回撤告警
  alert_daily_loss_threshold: 0.03  # 3% 日内亏损告警
  alert_data_stale_seconds: 120.0   # 120s 数据中断告警
  alert_inactivity_minutes: 120.0   # 120min 无成交告警

  # 指标收集
  metrics_enabled: true
  metrics:
    output_dir: "data/metrics/small_size"
    write_interval_sec: 60
