# Tiered Portfolio V2 — 30万进取型
# ====================================================================
# 三组件配置: CSI2000(60%) + CB(20%) + ETF(20%)
# CSI2000 分配: 30万×60% = 18万 → 映射到18w数据点
#
# P22 实测 (修正映射): AR=16.5%  MDD=23.6%  SR=1.018  Calmar=0.700
# 前瞻预期 AR: 13-15% (含 alpha 衰减折扣)
#
# 对比保守型(CB60%+ETF40%): AR 16.5% vs 12.6%, MDD 23.6% vs 7.1%
# 适合能承受较高回撤、追求更高年化收益的投资者
# ====================================================================

profile_name: "tiered_combo_30w_v2_aggressive"
description: >
  三组件跨资产组合（30万进取型）:
  CSI2000(60%) + CB(20%) + ETF(20%)
  CSI2000分配18万，超过15万性能门槛

initial_capital: 300000.0

portfolio_weights:
  ml_csi2000: 0.60
  cb_stock_quality: 0.20
  etf: 0.20

pillars:
  ml_csi2000:
    name: "ML CSI2000 V3b 6-Model Ensemble"
    description: "LGB x5 + MASTER V2, rank_average融合"
    market_type: "a_stock"
    weight: 0.60
    legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
    model_dir: "models/ml_csi2000_lgb_20d_r40"
    ensemble_predictions:
      - "models/ml_csi2000_lgb_20d_r40/oos_predictions.parquet"
      - "models/ml_csi2000_de_10d/oos_predictions.parquet"
      - "models/ml_csi2000_lgb_b3_sizeneutral/oos_predictions.parquet"
      - "models/ml_csi2000_lgb_fund_t1aligned/oos_predictions.parquet"
      - "models/ml_csi2000_lgb_20d_neutral_p1/oos_predictions.parquet"
      - "models/ml_csi2000_master_v2/oos_predictions.parquet"
    ensemble_method: "rank_average"
    ensemble_weights:
      ml_csi2000_lgb_20d_r40: 1.87
      ml_csi2000_de_10d: 1.46
      ml_csi2000_lgb_b3_sizeneutral: 1.46
      ml_csi2000_lgb_fund_t1aligned: 1.20
      ml_csi2000_lgb_20d_neutral_p1: 2.15
      ml_csi2000_master_v2: 0.70
    universe: "csi2000"
    top_k: 50
    rebalance_days: 5
    max_industry_pct: 0.15
    max_stock_pct: 0.03
    vol_target: 0.20
    vol_lookback: 60
    lot_size: 100
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.18
    commission_rate: 0.0000854
    commission_min: 5.0
    stamp_tax_sell: 0.0005
    transfer_fee: 0.00001
    slippage_bps: 8.0
    max_participation_rate: 0.10

  cb_stock_quality:
    name: "CB Stock Quality V4b Balanced"
    description: "正股质量增强6因子CB策略"
    market_type: "convertible_bond"
    weight: 0.20
    strategy_name: "cb_stock_quality"
    strategy_config: "configs/cb_strategies/cb_stock_quality_v4b_balanced_8y.yml"
    top_k: 10
    rebalance_days: 1
    commission_rate: 0.0000854
    commission_min: 5.0
    slippage_bps: 5.0
    slippage_model: "linear_impact"

  etf:
    name: "ETF Cross Asset V5 FAA"
    description: "10只ETF Flexible Asset Allocation"
    market_type: "etf"
    weight: 0.20
    strategy_name: "etf_cross_v5"
    top_k: 3
    rebalance_days: 10
    symbols:
      - "510300.SH"
      - "510500.SH"
      - "159915.SZ"
      - "512100.SH"
      - "510050.SH"
      - "510880.SH"
      - "512010.SH"
      - "512690.SH"
      - "512660.SH"
      - "513100.SH"
      - "159920.SZ"
    commission_rate: 0.0000854
    commission_min: 5.0
    slippage_bps: 5.0
    max_participation_rate: 0.10
