# 多Alpha动态因子融合策略 — 10年回测配置
# ============================================================
# 策略逻辑: 融合小规模+动量+放量+低溢价+低价 5个独立alpha
# 回测区间: 2015-01-01 ~ 2024-12-31 (10年)
# ============================================================

name: "cb_multi_alpha_10y"
description: >
  可转债多Alpha动态因子融合策略 10年回测。综合小规模(30%)、动量(20%)、
  放量突破(20%)、低溢价(15%)、低价(15%) 五因子加权打分。

data:
  source: "tushare_cb"
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_multi_alpha"
  params:
    top_k: 8
    rebalance_days: 1
    buffer_k: 3
    max_price: 150.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 10.0
    min_days_to_maturity: 60
    exclude_st: true
    exclude_called: true
    max_premium: 80.0
    momentum_lookback: 10
    surge_lookback: 20
    warmup_bars: 25
    w_size: 0.30
    w_momentum: 0.20
    w_surge: 0.20
    w_premium: 0.15
    w_price: 0.15
    stop_loss_pct: 0.12
    min_positions: 3
    lot_size: 10

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_multi_alpha_10y"
