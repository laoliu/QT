# R124 四组件跨资产组合 — 权重优化版 (v2: CF-001 合规)
# ====================================================================
# 基于 R123 完整 combo 回测 + 6 位专家评审 (2026-03-29)
# v2 变更 (2026-03-29):
#   CF-001 合规: CB 25% → 5% (50万, 容量上限)
#   释放 20% 按 R120 共识重分配: ML2000+10%, ML1000+5%, ETF+5%
#
# 变更 (vs R116):
#   1. CSI2000 权重 35% -> 50% (最强 alpha 源, 无衰减)
#   2. CSI1000 权重 15% -> 15% (CF-002: ≤10%, 但v2增配+5%)
#   3. CSI1000 model 保持旧模型 (lgb_fund, AR=26.3%)
#   4. CB 权重 25% -> 5% (CF-001: 容量≤50万)
#   5. ETF 25% -> 30% (尾部对冲+流动性缓冲)
#
# 回测结果 (v1, 需重测 v2):
#   v1: AR=25.6%, SR=1.53, MDD=14.2%, Calmar=1.80
# ====================================================================

profile_name: "r124_combo"
description: >
  R124 四组件跨资产组合 — 权重优化版
  CSI2000权重提升至40%, CSI1000降至10%(旧模型)

initial_capital: 10000000.0

portfolio_weights:
  ml_csi2000: 0.50       # CF-001 释放 +10% (最强alpha源)
  ml_csi1000: 0.15       # CF-002: 建议≤10%, 此处+5%补偿CB减配
  cb: 0.05               # CF-001: 50万/10M=5% (容量上限)
  etf: 0.30              # 尾部对冲+流动性缓冲 +5%

# ── ML CSI2000 (与R122一致) ──
ml_csi2000:
  asset_type: "a_stock"
  model_dir: "models/ml_csi2000_lgb_fund"
  universe: "csi2000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── ML CSI1000 Fund 模型 (旧模型, AR=26.3%) ──
ml_csi1000:
  asset_type: "a_stock"
  model_dir: "models/ml_csi1000_lgb_fund"
  universe: "csi1000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── CB Stock Quality (与R122一致) ──
cb:
  asset_type: "convertible_bond"
  top_k: 10
  rebalance_freq: "daily"
  max_price: 145.0
  max_issue_size: 20000.0
  min_turnover: 20.0
  max_premium: 60.0
  min_age_days: 3
  min_days_to_maturity: 30
  factor_weights:
    price: 0.18
    premium: 0.12
    stock_roe: 0.25
    stock_ep: 0.20
    stock_vol: 0.15
    issue_size: 0.10
  lot_size: 10
  commission_rate: 0.0000854
  commission_min: 5.0
  slippage_bps: 5.0

# ── ETF Cross V6 FAA (与R122一致) ──
etf:
  asset_type: "etf"
  top_k: 3
  rebalance_freq: "every_10d"
  symbols:
    - "510300.SH"
    - "510500.SH"
    - "159915.SZ"
    - "512100.SH"
    - "510050.SH"
    - "510880.SH"
    - "512010.SH"
    - "512690.SH"
    - "512660.SH"
    - "513100.SH"
    - "159920.SZ"
    - "518880.SH"
    - "511010.SH"

# ── 监控 ──
monitoring:
  risk_contribution:
    ml_csi2000_max: 0.55
    check_frequency: weekly
  alpha_decay:
    rolling_sr_window: 252
    sr_threshold: 0.0
    max_consecutive_months: 6
    check_frequency: monthly
  drawdown:
    warn_level: -0.20
    halt_level: -0.25
