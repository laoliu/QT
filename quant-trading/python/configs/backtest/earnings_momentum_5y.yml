cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05
data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare
fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
frequency:
  data_frequency: 1d
  matching_resolution: 1d
initial_capital: 1000000
market:
  instruments:
    asset_type: stock
    boards:
    - A
    index: 000300.SH
  region: CN
report:
  benchmark: 000300.SH
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  - win_rate
  - positions_count_distribution
  - cost_impact
  - alpha
  - beta
  - information_ratio
  output_dir: reports/earnings_momentum_5y
  universe_summary: true
risk_constraints:
  max_drawdown_pct: 0.2
  max_sector_pct: 0.25
  max_single_position_pct: 0.05
  market_regime_enabled: true
  benchmark_symbol: 000300.SH
run:
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  start_date: '2020-01-01'
  timezone: Asia/Shanghai
slippage_model:
  bps: 5
  name: fixed_bps
strategy:
  name: earnings_momentum
  parameters:
    benchmark: 000300.SH
    buffer_k: 8
    exclude_st: true
    lot_size: 100
    max_price: 100.0
    max_single_pct: 0.05
    min_listed_days: 120
    min_mv: 150000.0
    min_price: 5.0
    min_turnover: 800.0
    momentum_lookback: 20
    rebalance_days: 15
    stop_loss_pct: 0.15
    cash_reserve_pct: 0.05  # 现金缓冲比例（显式声明，避免依赖默认值）
    top_k: 25
    volatility_lookback: 60
    weight_earnings_accel: 0.30
    weight_revenue_growth: 0.20
    weight_sue: 0.20
    weight_momentum: 0.15
    weight_quality: 0.10
    weight_volatility: 0.05
    min_earnings_growth: 10.0
    min_revenue_growth: 5.0
    min_roe: 5.0
    max_pe: 150.0
trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1
universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  base_index: 000300.SH
  manual_exclude_list: configs/universe/exclude_list.yml
  name: earnings_momentum
