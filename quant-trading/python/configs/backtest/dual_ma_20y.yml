# 双均线策略 — 20 年回测 (2005-2025)
#
# 覆盖 2005.1 ~ 2024.12，含 A 股多轮牛熊周期。
# 趋势跟踪策略在强趋势行情中表现突出，在震荡市可能产生较多虚假信号。
#
# 费率说明：
#   当前配置使用 2023.8.28 后费率（印花税千0.5），对 2005-2023 期间
#   历史实际印花税（最高时双边千3）有所低估。这是已知的近似。

name: "dual_ma_20y"
description: >
  双均线交叉策略 20 年回测 — 基于短期(5日)和长期(20日)移动平均线
  的交叉信号进行交易。覆盖 2005-2024 完整牛熊周期。

data:
  source: "tushare_pro"
  start_date: "2005-01-04"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "qfq"
  cache_dir: "data/cache/tushare"

strategy:
  name: "demo_dual_ma"
  params:
    short_window: 5
    long_window: 20
    position_pct: 0.10
    max_positions: 10
    target_symbols:
      - "000001.SZ"   # 平安银行
      - "600519.SH"   # 贵州茅台
      - "000858.SZ"   # 五粮液
      - "002594.SZ"   # 比亚迪
      - "000333.SZ"   # 美的集团

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

universe:
  policy: "default"
  exclude_st: true
  exclude_suspended: true
  exclude_limit: true
  min_listing_days: 60

cost:
  commission_rate: 8.54e-05  # §13.1 MarketRulesCNEquity 万2.5
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  transfer_fee_rate: 0.00001

slippage:
  model: "fixed_bps"
  bps: 5.0

capital:
  initial: 1000000.0
  currency: "CNY"
