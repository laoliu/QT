# CBComprehensive 可转债10因子综合策略 — 10年回测配置
# ============================================================
#
# 策略逻辑:
#   10因子排名归一化加权评分:
#   价格12% + 溢价率12% + 规模10% + 次新6% + 均值回归15%
#   + 评级10% + Delta暴露10% + YTM10% + 流动性5% + 动量10%
#
# 回测区间: 2015-01-01 ~ 2024-12-31 (10年)
# ============================================================

name: "cb_comprehensive_10y"
description: >
  CBComprehensive 10因子综合可转债策略 10年回测。
  在DoubleLow+基础上增加Delta暴露、到期收益率、流动性、动量4个因子。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "cb_comprehensive"
  params:
    top_k: 10
    rebalance_days: 3
    max_price: 145.0
    max_issue_size: 30000.0
    min_issue_size: 1000.0
    min_turnover: 15.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10             # C-7: 收紧止损
    trailing_stop_pct: 0.05          # C-7: 追踪止损
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    max_premium: 70.0
    lookback: 20
    bb_k: 2.0
    momentum_lookback: 10
    # 10因子权重
    weight_price: 0.12
    weight_premium: 0.12
    weight_size: 0.10
    weight_age: 0.06
    weight_mean_reversion: 0.15
    weight_rating: 0.10
    weight_delta: 0.10
    weight_ytm: 0.10
    weight_turnover: 0.05
    weight_momentum: 0.10
    min_candidates: 5

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本(可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

# ------ 资金与规模 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 风控约束 ------
risk:
  enabled: true
  max_position_weight: 0.15
  max_drawdown: 0.50
  enable_audit_log: true

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/cb_comprehensive_10y"
