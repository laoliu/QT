# 手动剔除清单
#
# 本文件供 ManualExclusionRule 加载，用于在自动剔除（ST/退市/停牌）之外
# 额外排除特定标的。支持两种匹配方式：
#   1. ts_code: 精准匹配证券代码
#   2. name_keyword: 包含匹配证券简称关键字
#
# 字段说明：
#   - reason:         必填，剔除原因（用于审计日志与报告统计）
#   - effective_from:  生效起始日期（YYYY-MM-DD），null 表示向前无限
#   - effective_to:    生效结束日期（YYYY-MM-DD），null 表示持续生效
#
# 使用场景示例：
#   - 重大财务造假 / 立案调查 / 退市风险警示
#   - 流动性极差、长期停牌后复牌
#   - 研究员主观判断需要排除的标的
#
# 注意：
#   - 本文件中的"000001.SZ"条目仅作格式示范，不会在生产环境中生效
#     （effective_to 已设为 2000-01-02，即不影响真实回测）
#   - 修改本文件后无需重启回测；每次回测启动时会重新加载

items:
  # ── 格式示范（无副作用）──────────────────────────
  - ts_code: "000001.SZ"
    reason: "格式示范条目（不影响生产回测）"
    effective_from: "2000-01-01"
    effective_to: "2000-01-02"

  # ── 按关键字批量排除 ────────────────────────────
  # 以下规则与 STExclusionRule 互补：当自动 ST 检测遗漏时兜底
  # 通常不需要手动添加，除非发现数据源 is_st 标志延迟
  # - name_keyword: "*ST"
  #   reason: "手动兜底：名称含 *ST"
  #   effective_from: "2000-01-01"
  #   effective_to: null

  # ── 按代码精准排除（根据需要取消注释）─────────────
  # - ts_code: "600xxx.SH"
  #   reason: "重大财务造假立案调查"
  #   effective_from: "2024-01-15"
  #   effective_to: null
  #
  # - ts_code: "000xxx.SZ"
  #   reason: "流动性不足 — 长期停牌后复牌首日"
  #   effective_from: "2024-03-01"
  #   effective_to: "2024-03-15"
