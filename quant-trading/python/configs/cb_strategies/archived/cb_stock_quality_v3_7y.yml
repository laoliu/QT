# CBStockQuality v3 — 风险调整优化版
# ============================================================
# 基于 v2 (AR=37.5%, SR=1.039) 针对专家审查意见的改进版本。
#
# v2→v3 变更理据：
#   1. top_k 5→10: 降低集中度风险，改善风险调整指标
#      - SR: 1.039→1.320 (+27%), 2020年回报: 219%→124% (-43%)
#      - 直接回应专家"2020单年贡献65-72%总收益"的🔴问题
#      - Post-2022筛选器仅通过~3只CB，top_k=10不影响新规后表现
#   2. 其余参数不变: 经V3 7变体对比测试，放宽issue_size/premium
#      均恶化Post-2022表现，当前参数组合为局部最优
#
# V3 7变体对比结论:
#   - v3a_wide_size(tk=10,sz=40k):   Full SR=1.324, P22 AR=-1.9% ✗
#   - v3b_wide_balanced(balanced wt): Full SR=1.021, P22 AR=-0.7% ✗
#   - v3c_pure_cb(zero stock wt):     Full SR=1.255, P22 AR=+2.6%
#   - v3d_very_wide(tk=15,sz=60k):    Full SR=1.044, P22 AR=-2.9% ✗
#   - v3e_tk10(仅top_k=10):           Full SR=1.320, P22 AR=+10.0% ✓ ← 选用
#   - v3f_wider_size(仅sz=40k):       Full SR=0.700, P22 AR=-4.0% ✗
#
# 已知限制:
#   - Post-2022 AR≈10% (2022-08-01新规后CB小盘alpha结构性衰减)
#   - 2020年仍为最强单年(123.6%)，但集中度较v2降低43%
#   - 需通过多策略组合层面达成30%年化目标
#
# 因子矩阵（5+1 因子，双层结构不变）：
#   Layer 1 (CB本体): price(0.18) + premium(0.12)
#   Layer 2 (正股质量): stock_roe(0.20) + stock_ep(0.15) + stock_vol(0.10)
#   Structural: issue_size(0.25)
#   → 总权重 = 1.00
# ============================================================

name: "cb_stock_quality_v3_7y"
description: >
  正股质量加强型CB策略 v3（风险调整优化版）。
  5+1 因子: price(0.18) + premium(0.12) + stock_roe(0.20) + stock_ep(0.15)
  + stock_vol(0.10) + issue_size(0.25)。
  分散持仓(top_k=10) + 小盘筛选(sz≤20000) + 日频调仓。
  v2→v3: top_k 5→10, SR 1.039→1.320, 2020集中度降低43%。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality"
  params:
    # --- 结构参数（v3: top_k 5→10, 降低集中度风险） ---
    top_k: 10
    rebalance_days: 1
    # --- 过滤参数（与v2一致，经测试为局部最优） ---
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 60.0
    # --- Layer 1 权重 (CB 本体，合计 0.30) ---
    weight_price: 0.18
    weight_premium: 0.12
    # --- Layer 2 权重 (正股质量，合计 0.45) ---
    weight_stock_roe: 0.20
    weight_stock_ep: 0.15
    weight_stock_vol: 0.10
    # --- Structural (规模因子，0.25) ---
    weight_issue_size: 0.25
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true
    default_roe: 0.0
    default_ep: 0.0

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42

output_dir: "output/cb_stock_quality_v3_7y"
