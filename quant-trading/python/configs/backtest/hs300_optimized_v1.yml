# 优化版 V1：HS300 SmallCap Rotation（动态成分 + 风控增强）
# 关键改进：
#   - top_k: 5 → 15（分散集中度风险，S3）
#   - weight_small_cap: 0.80 → 0.30（避免纯小盘暴露，S2）
#   - stop_loss_pct: 0.50 → 0.15（启用有效止损，S4）
#   - trailing_stop_pct: 0 → 0.12（追踪止损保护浮盈）
#   - drawdown_control: enabled=true（回撤控制，R2）
#   - slippage: 3bps → 15bps（更现实的成本，L1）
#   - max_single_pct: 0.25 → 0.10（单票限制更严）
#   - buffer_k: 3 → 5（减少不必要换手）

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000300.SH
  region: CN

report:
  benchmark: 000300.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar, turnover]
  output_dir: reports/hs300_optimized_v1
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.40
  max_sector_pct: 0.30
  max_single_position_pct: 0.10

risk:
  enabled: true
  stop_loss_pct: 0.15
  trailing_stop_pct: 0.12
  circuit_breaker_enabled: false
  market_regime_enabled: false
  position_sizing:
    volatility_target:
      enabled: true
      target_vol: 0.20
      lookback_days: 20
      min_scale: 0.30
      max_scale: 1.0
    drawdown_control:
      enabled: true
      threshold: 0.08
      max_threshold: 0.15
      min_scale: 0.30

run:
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  start_date: '2016-07-01'
  timezone: Asia/Shanghai

slippage_model:
  bps: 15
  name: fixed_bps

strategy:
  name: smallcap_rotation
  parameters:
    top_k: 15
    rebalance_days: 15
    min_mv: 50000.0
    max_mv: 5000000.0
    min_price: 3.0
    max_price: 200.0
    min_turnover: 500.0
    min_listed_days: 60
    stop_loss_pct: 0.15
    trailing_stop_pct: 0.12
    buffer_k: 5
    cash_reserve_pct: 0.03
    max_single_pct: 0.10
    momentum_lookback: 20
    volatility_lookback: 20
    momentum_invert: false
    momentum_skip_recent: 1
    momentum_multi_period: true
    regime_adaptive: false
    # 均衡因子权重（告别纯小盘偏执）
    weight_small_cap: 0.30
    weight_momentum: 0.15
    weight_turnover: 0.10
    weight_volatility: 0.15
    weight_quality: 0.15
    weight_value: 0.15

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000300.SH
  manual_exclude_list: configs/universe/exclude_list.yml
