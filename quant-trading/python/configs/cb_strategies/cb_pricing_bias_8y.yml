# 定价偏差因子策略 8 年回测配置
# CB Pricing Bias Factor Strategy — 理论定价 vs 市场价偏差
#
# 核心创新：简化 BSM/MC 定价模型估算理论价值，寻找被低估的 CB
# 参考：arXiv 2409.06496 (Monte Carlo valuation of Chinese CB)

name: "cb_pricing_bias_8y"
description: >
  定价偏差因子策略 — 理论 CB 价值 vs 市场价偏差评分。
  捕获被低估的可转债。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2025-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_pricing_bias"
  params:
    top_k: 20
    rebalance_days: 5
    max_price: 160.0
    min_turnover: 20.0
    min_days_to_maturity: 60
    stop_loss_pct: 0.20
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 100.0
    risk_free_rate: 0.025
    vol_proxy: 0.30
    weight_pricing_bias: 0.30
    weight_time_value: 0.15
    weight_price: 0.20
    weight_premium: 0.15
    weight_rating: 0.10
    weight_issue_size: 0.10

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_pricing_bias_8y"

report:
  benchmark: "000300.SH"
