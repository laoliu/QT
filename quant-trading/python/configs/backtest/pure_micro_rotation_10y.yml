# 纯微盘轮动策略 — 极致小市值版 10年回测
# 核心思路: 纯粹按市值最小排序, 5日轮动
# 市值范围: 5亿~20亿 (极致微盘, 但排除壳资源)
# 费率: 万0.86佣金(用户实际), 高保守滑点
# 参考: CSDN研究AR=37.7%, 万得微盘指数10年25倍

cost_model:
  commission: {min_fee: 5.0, rate: 0.000086}
  stamp_tax: {sell_rate: 0.0005}
  transfer_fee: {rate: 1.0e-05}

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.03
    lot_size: 100
    opening_volume_fraction: 0.08

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
  region: CN

report:
  benchmark: 000905.SH
  output_dir: output/pure_micro_rotation_10y

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: linear_impact
  base_bps: 8.0
  impact_coeff: 80.0
  fallback_bps: 15.0
  max_bps: 100.0

strategy:
  name: smallcap_rotation
  parameters:
    top_k: 10
    rebalance_days: 5
    min_price: 2.0
    max_price: 20.0
    min_turnover: 500.0
    min_listed_days: 120
    min_mv: 50000.0
    max_mv: 200000.0
    stop_loss_pct: 0.25
    trailing_stop_pct: 0.0
    buffer_k: 3
    max_single_pct: 0.12
    momentum_invert: false
    weight_small_cap: 1.00
    weight_momentum: 0.0
    weight_turnover: 0.0
    weight_volatility: 0.0
    weight_quality: 0.0
    weight_value: 0.0
    regime_adaptive: false

risk_constraints:
  max_drawdown_pct: 0.55
  drawdown_peak_reset_days: 90
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.3

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
