# 低波价值 v2 — 保守费率版 10年回测
# 基于当前最佳 A 股策略 low_vol_value_12y (AR=12.7%)
# 修正：
#   1) commission 万一→万三（实际券商费率）
#   2) slippage impact 0.1→30（合理冲击成本）
#   3) trailing_stop 12%→0%（消除过紧止损）
#   4) stop_loss 15%→25%（大盘股放宽）
#   5) 去掉 circuit_breaker（避免死亡螺旋）
# 目的：验证真实费率下 low_vol_value 策略的净收益

cost_model:
  commission: {min_fee: 5.0, rate: 0.0003}
  stamp_tax: {sell_rate: 0.0005}
  transfer_fee: {rate: 1.0e-05}

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.08
    lot_size: 100
    opening_volume_fraction: 0.10

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000300.SH
  region: CN

report:
  benchmark: 000300.SH
  output_dir: output/low_vol_value_v2_10y

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 30.0
  fallback_bps: 10.0
  max_bps: 50.0

strategy:
  name: low_vol_value
  parameters:
    top_k: 30
    rebalance_days: 20
    min_price: 3.0
    max_price: 300.0
    min_turnover: 1000.0
    min_listed_days: 120
    stop_loss_pct: 0.25
    trailing_stop_pct: 0.0
    buffer_k: 10
    max_single_pct: 0.05
    min_mv: 500000.0
    inverse_vol_weighting: true
    max_industry_pct: 0.20
    weight_volatility: 0.35
    weight_value: 0.30
    weight_quality: 0.20
    weight_turnover: 0.15
    value_ep_weight: 0.50
    value_bp_weight: 0.50
    min_roe: 5.0
    max_pe: 50.0
    max_pb: 10.0
    ewma_halflife: 20
    volatility_lookback: 60

risk_constraints:
  max_drawdown_pct: 0.50
  drawdown_peak_reset_days: 60
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000300.SH
