# 回测配置模板（带完整注释）
# 用法: run_backtest_from_config("configs/backtest/examples/_template.yml")
#
# 此文件记录所有可用配置项及其含义，可作为创建新配置的起点

# ============================================================================
# 回测基本信息
# ============================================================================
name: "config_template"  # [必填] 回测名称，用于报告和日志
description: |  # [可选] 详细描述
  这是一个配置模板文件
  记录所有可用选项

# ============================================================================
# 数据配置 (data)
# ============================================================================
data:
  # [必填] 数据源
  # 可选值: tushare, local, synthetic
  source: "tushare"
  
  # [必填] 回测日期范围 (格式: YYYY-MM-DD)
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  
  # [可选] 限定股票列表，null 表示全市场
  # 示例: ["000001.SZ", "600000.SH"]
  symbols: null
  
  # [可选] 数据频率
  # 可选值: 1d (日), 1m (分钟), 5m, 15m, 30m, 60m
  # 默认: 1d
  frequency: "1d"
  
  # [可选] 复权方式
  # 可选值: qfq (前复权), hfq (后复权), none
  # 默认: qfq
  adjust: "qfq"
  
  # [可选] 数据缓存目录
  # 默认: null (不缓存)
  cache_dir: "data/cache"

# ============================================================================
# 股票池配置 (universe)
# ============================================================================
universe:
  # [可选] 股票池策略
  # 可选值: default (全A股), whitelist (使用 data.symbols), 
  #         hs300 (沪深300), zz500 (中证500)
  # 默认: default
  policy: "default"
  
  # [可选] 自动剔除 ST/*ST 股票
  # 默认: true
  exclude_st: true
  
  # [可选] 自动剔除停牌股票
  # 默认: true
  exclude_suspended: true
  
  # [可选] 下单时避开涨跌停
  # 默认: true
  exclude_limit: true
  
  # [可选] 手动剔除名单路径
  # 格式见: configs/universe/exclude_list.yml
  # 默认: null
  exclude_list_path: "configs/universe/exclude_list.yml"
  
  # [可选] 最小上市天数
  # 默认: 60
  min_listing_days: 60

# ============================================================================
# 策略配置 (strategy)
# ============================================================================
strategy:
  # [必填] 策略名称/类型
  # 对应策略工厂中注册的策略类
  name: "example_strategy"
  
  # [可选] 策略参数
  # 具体参数取决于策略类型
  params:
    param1: 10
    param2: 0.5
    param3: "value"

# ============================================================================
# 成本配置 (cost)
# ============================================================================
cost:
  # [可选] 佣金率
  # A股默认: 0.000085 (万0.85, §13.1 MarketRulesCNEquity)
  # CB默认: 0.0001 (万1, §13.1 MarketRulesConvertibleBond)
  commission_rate: 8.54e-05
  
  # [可选] 最低佣金 (元)
  # 默认: 5.0
  commission_min: 5.0
  
  # [可选] 印花税率 (仅卖出收取)
  # 默认: 0.0005 (千分之五，2023年8月下调后)
  # 注意: 2023年8月28日前为 0.001 (千分之十)
  stamp_tax_rate: 0.0005
  
  # [可选] 过户费率
  # 默认: 0.00001 (1元/10万)
  # 注意: 仅对上海市场收取，深圳不收
  transfer_fee_rate: 0.00001
  
  # [可选] 滑点 (基点, bps)
  # A股默认: 10.0 bps (§13.1 MarketRulesCNEquity)
  # CB默认: 5.0 bps (§13.1 MarketRulesConvertibleBond)
  slippage_bps: 10.0  # §13.1 A股默认，CB请设为5.0

# ============================================================================
# 回测设置
# ============================================================================

# [可选] 初始资金 (元)
# 默认: 1,000,000 (100万)
initial_capital: 1000000.0

# [可选] 最小交易单位 (手)
# A股固定为 100
# 默认: 100
lot_size: 100

# [可选] T+N 规则
# A股为 T+1，即买入当日不可卖出
# 默认: 1
t_plus_n: 1

# [可选] 随机种子
# 用于可复现性，null 表示使用随机值
# 默认: null
random_seed: 42

# [可选] 输出目录
# 回测报告和指纹保存位置
# 默认: "output"
output_dir: "output/template"
