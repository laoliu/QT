# ETF 轮动策略 — 跨资产分散 + 短周期动量
# 特点: 包含股/债/商品ETF实现跨资产轮动
# 短周期动量(20d), 更频繁调仓(10天), top_k=4

cost_model:
  commission: {min_fee: 5.0, rate: 0.00005}
  stamp_tax: {sell_rate: 0.0}
  transfer_fee: {rate: 0.0}

data:
  provider: tushare_etf
  cache_dir: data/cache/tushare
  adjust: qfq
  symbols:
    # 宽基权益
    - 510300.SH   # 沪深300
    - 510500.SH   # 中证500
    - 159915.SZ   # 创业板
    - 512100.SH   # 中证1000
    - 510050.SH   # 上证50
    # 风格/行业
    - 510880.SH   # 红利
    - 512010.SH   # 医药
    - 512690.SH   # 酒
    - 512660.SH   # 军工
    # 跨境权益
    - 513100.SH   # 纳指
    - 159920.SZ   # 恒生
    # 商品 (关键分散化标的)
    - 518880.SH   # 黄金
    # 债券 (关键分散化标的)
    - 511010.SH   # 国债

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.02
    lot_size: 100
    opening_volume_fraction: 0.10

initial_capital: 1000000

report:
  benchmark: 510300.SH
  output_dir: output/etf_cross_asset_10y

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: fixed
  bps: 1.0

strategy:
  name: etf_rotation
  parameters:
    top_k: 4
    rebalance_days: 10           # 更频繁调仓
    weight_momentum: 0.50
    weight_volatility: 0.35
    weight_reversion: 0.15
    weight_volume: 0.0
    momentum_lookback: 20        # 短周期动量
    volatility_lookback: 20
    reversion_lookback: 5
    trend_ma_period: 0           # 关闭趋势过滤
    stop_loss_pct: 0.0
    trailing_stop_pct: 0.0
    cash_reserve_pct: 0.02
    max_single_pct: 0.40
    lot_size: 100
    min_amount: 0.0
    buffer_k: 1
    inverse_vol_weighting: true

trading_rules:
  t_plus: 1
  lot_size: 100

risk_constraints:
  enabled: true
  max_position_weight: 0.50
  max_drawdown: 0.50
  drawdown_peak_reset_days: 30
  enable_audit_log: true
