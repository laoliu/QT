# Tiered Portfolio V2.1 — 市值分层三组件组合 + MASTER V2 + MDD Control
# ====================================================================
# V2→V2.1 变更 (P0a):
#   - CSI2000 新增 MDD 梯度减仓 + 个股止损
#     MDD 控制前: AR=29.81%, SR=1.221, MDD=34.23%
#     MDD 控制后: AR=14.30%, SR=0.804, MDD=24.62%
#   - 保持组合权重 50/15/35 不变

profile_name: "tiered_combo_v2"
description: >
  市值分层三组件跨资产组合 V2 (MASTER V2 enhanced)
  CSI2000(50%) + CSI300≥200B(15%) + ETF(35%)

initial_capital: 10000000.0

portfolio_weights:
  ml_csi2000: 0.50
  ml_csi300_ge200b: 0.15
  etf: 0.35

# ── ML CSI2000 V3b Ensemble (5 LGB + MASTER V2, ICIR-weighted) ──
ml_csi2000:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi2000_lgb_20d_r40"
  ensemble_predictions:
    - "models/ml_csi2000_lgb_20d_r40/oos_predictions.parquet"
    - "models/ml_csi2000_de_10d/oos_predictions.parquet"
    - "models/ml_csi2000_lgb_b3_sizeneutral/oos_predictions.parquet"
    - "models/ml_csi2000_lgb_fund_t1aligned/oos_predictions.parquet"
    - "models/ml_csi2000_lgb_20d_neutral_p1/oos_predictions.parquet"
    - "models/ml_csi2000_master_v2/oos_predictions.parquet"
  ensemble_method: "rank_average"
  ensemble_weights:
    ml_csi2000_lgb_20d_r40: 1.87
    ml_csi2000_de_10d: 1.46
    ml_csi2000_lgb_b3_sizeneutral: 1.46
    ml_csi2000_lgb_fund_t1aligned: 1.20
    ml_csi2000_lgb_20d_neutral_p1: 2.15
    ml_csi2000_master_v2: 0.70
  universe: "csi2000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  # P0a: MDD 梯度减仓
  mdd_gradient:
    enabled: true
    levels:
      - [0.10, 1.00]
      - [0.15, 0.85]
      - [0.20, 0.60]
      - [0.25, 0.35]
      - [1.00, 0.10]
  # P0a: 个股止损
  stop_loss_pct: 0.18
  trailing_stop_pct: 0.15
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 8.0

# ── ML CSI300 ≥200B (T+1 Open aligned) ──
ml_csi300_ge200b:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi300_lgb_p3_t1a_open"
  oos_predictions_path: "models/ml_csi300_lgb_p3_t1a_open/oos_predictions.parquet"
  universe: "csi300"
  min_mv_yi: 200           # ≥200亿流通市值
  top_k: 30
  rebalance_freq: "every_5d"
  max_sector_pct: 0.20
  max_stock_pct: 0.05
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── ETF Cross V6 FAA (same as R124) ──
etf:
  asset_type: "etf"
  top_k: 3
  rebalance_freq: "every_10d"
  symbols:
    - "510300.SH"
    - "510500.SH"
    - "159915.SZ"
    - "512100.SH"
    - "510050.SH"
    - "510880.SH"
    - "512010.SH"
    - "512690.SH"
    - "512660.SH"
    - "513100.SH"
    - "159920.SZ"
    - "518880.SH"
    - "511010.SH"

# ── 监控 ──
monitoring:
  risk_contribution:
    ml_csi2000_max: 0.50
    check_frequency: weekly
  alpha_decay:
    rolling_sr_window: 252
    sr_threshold: 0.0
    max_consecutive_months: 6
    check_frequency: monthly
  correlation:
    max_pairwise: 0.75
    max_avg: 0.60
    check_frequency: monthly
