name: "new_small_v2"
description: >
  次新小盘策略 V2（参数边界研究版，非生产配置）�?
  实验目的：测�?max_age_days 变化�?MDD 的边际影响，
  最终结�?new_small 系列 7 年窗�?MDD �?33%，无法满�?30% 硬门槛�?

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "new_small"
  params:
    top_k: 5                       # �?�?10 降至 5：与 new_small_optimized 一致，已验�?MDD=28.9%
    rebalance_days: 1              # 日频调仓，保持次新效应捕捉能�?
    min_age_days: 5
    max_age_days: 95               # 边界测试: 90(optimized,MDD=28.9%) vs 120(FAIL,MDD=38.9%) �?测试 95
    max_issue_size: 60000.0        # 万元�? 亿以下）
    max_price: 150.0
    min_turnover: 10.0             # 最低成交额 10 万（保持宽松，避免过滤核心候选）
    exclude_st: true
    stop_loss_pct: 0.10            # �?�?0.15 收紧�?0.10：更早止损，控制单券最大损�?
    min_positions: 1               # 允许少于 k 只时仍开�?
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本（可转债） ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0               # 保守滑点（CB 市场 3-8bps 区间�?
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

# ------ 资金与规�?------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 风控约束 ------
# 调整说明:
#   max_drawdown �?0.50（optimized）收�?0.40，比 0.20 宽松避免反馈循环�?
#   但比 0.50 更保守，有助于在极端行情�?022 �?CB 熊市）触发减仓�?
#   max_position_weight=0.16 匹配 k=7 等权�?4.3%/�?+ 1.7% 缓冲）�?
risk:
  enabled: true
  max_position_weight: 0.22       # k=5 等权 20%，缓�?2%（与 optimized 对齐�?
  max_drawdown: 0.40              # �?optimized(0.50) 保守，仍高于 0.20(反馈循环阈�?
  enable_audit_log: true

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/new_small_v2"