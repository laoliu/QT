# 三低策略 — NBO 最优配置
# ============================================================
# 基于 80 组参数精扫的最优组合 (V4)
# 数据范围: 2022-01-04 ~ 2024-12-31 (726 交易日)
# 成交模型: next_bar_open (NBO)
#
# 验证指标 (NBO):
#   年化收益: 7.32% | 最大回撤: 20.05%
#   Sharpe: 0.411 | Calmar: 0.365
#   交易次数: 3187
#
# 关键发现:
#   - top_k=20 (更分散, 降低单券风险)
#   - rebalance_days=1 (每日轮动, NBO 下反而更优)
#   - max_premium=35% (更严格, 过滤低质量标的)
#
# ⚠ 已知问题:
#   - SBC vs NBO 差距大 (~9pp), 信号预测力有限
#     详见 docs/analysis/fill_model_impact_20260210.md
# ============================================================

name: "triple_low"
description: >
  三低策略 — 低价格 + 低溢价率 + 低转债价值的综合评分排名。
  等权归一化三因子评分 + 止损 + 强赎预警。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "triple_low"
  params:
    # 核心参数 (精扫最优)
    top_k: 20                     # 20只: 分散度最优
    rebalance_days: 1             # 每日轮动: NBO下 7.32% vs reb=3 的 6.87%
    buffer_k: 0                   # 无缓冲带: buf=0 一致最优

    # 筛选
    max_price: 130.0
    min_price: 0.0                # 不过滤低价 (测试证明更优)
    max_premium: 35.0             # ★ 35% 比 40% 更优 (7.32% vs 6.70%)
    min_issue_size: 0.0            # 发行规模下限 (静态字段, 无前视偏差)
    min_turnover: 20.0
    min_days_to_maturity: 30

    # 三因子等权
    price_weight: 0.33
    premium_weight: 0.33
    cb_value_weight: 0.34

    # 低余额因子
    low_size_threshold: 30000.0
    low_size_bonus: 0.1

    # 风控
    stop_loss_pct: 0.10
    force_redeem_threshold: 130.0
    force_redeem_days: 8

    # 交易
    lot_size: 10
    equal_weight: true
    exclude_called: true
    exclude_st: true

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0               # 三低策略原配 0.5bps
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/triple_low"

# ------ 报告 ------
report:
  benchmark: null
  custom_benchmark: "000832.CSI"

# ============================================================
# 验证结果
# ============================================================
verified_metrics:
  annual_return_pct: 7.32
  max_drawdown_pct: 20.05
  sharpe: 0.411
  calmar: 0.365
  total_trades: 3187

# ============================================================
# 已知风险
# ============================================================
risks:
  - "SBC vs NBO 差距极大 (~9pp): 大部分 alpha 来自成交假设"
  - "min_remain_size 已改用 issue_size (IPO静态字段), PIT偏差已消除 (R94修复确认)"
  - "每日轮动 (reb=1) 换手率高, 实际交易成本可能更大"
