# G5-4 高送转预期 (High Delivery Expectation) 12 年回测
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000905.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: high_delivery_expect
  parameters:
    top_k: 15
    rebalance_days: 20
    min_price: 3.0
    max_price: 80.0
    min_turnover: 300.0
    min_listed_days: 250
    stop_loss_pct: 0.22
    trailing_stop_pct: 0.18
    buffer_k: 5
    max_single_pct: 0.08
    min_mv: 100_000.0
    max_mv: 1_500_000.0
    max_industry_pct: 0.25

    weight_earnings: 0.30
    weight_size: 0.30
    weight_quality: 0.20
    weight_low_price: 0.20
    max_pe: 80.0
    min_roe: 3.0
