# 双低五因子增强策略 v1 — 8年回测 (2018-2026)
# ============================================================
# 灵感来源: 国金证券 2025 报告「双低五因子增强」
# 经济学基础:
#   - 经典双低（价格+溢价率）2022后因溢价率中枢上移逐渐衰减
#   - 叠加 DL 时序分位（历史估值锚点）→ 消除截面漂移
#   - 叠加短期反转（20日超跌）→ 捕捉均值回归 alpha
#   - 叠加已实现波动率分位 → 波动压缩 = 期权低估
#   - 信用评级 → 2024 年信用冲击后排除雷券
# 参考 AR>24%, ICIR=36.7%, 周胜率67% (国金证券)
# ============================================================

name: "cb_dl_enhanced_5f_v1_8y"
description: >
  双低五因子增强 v1 — DL+DL分位+反转+波动率+评级。
  5因子: DL(0.25) + DL_pct(0.25) + reversal(0.20) + RV_pct(0.15) + rating(0.15)。
  核心改进：加入时间序列维度的双低历史分位。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_dl_enhanced_5f"
  params:
    top_k: 20
    rebalance_days: 5
    max_price: 135.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    max_premium: 40.0
    exclude_st: true
    exclude_called: true
    stop_loss_pct: 0.10
    force_redeem_threshold: 130.0
    force_redeem_days: 8
    buffer_k: 2
    dl_percentile_window: 120
    reversal_window: 20
    rv_window: 20
    rv_percentile_window: 120
    min_history: 20
    premium_weight_in_dl: 1.0
    w_double_low: 0.70
    w_dl_percentile: 0.0
    w_reversal: 0.30
    w_rv_percentile: 0.0
    w_rating: 0.0

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_dl_enhanced_5f_v1_8y"

report:
  benchmark: "000300.SH"
