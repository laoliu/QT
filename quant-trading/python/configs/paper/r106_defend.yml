# R106 防御型跨资产组合 — 标准 multi_asset 模拟盘配置

paper_engine:
  strategy_name: "r106_defend"
  description: "R106 防御型：小盘成长 15% + 高股息 15% + 双低转债 30% + 债券 ETF 40%"
  market_type: "multi_asset"
  poll_interval: 10.0
  bar_interval_sec: 60
  initial_capital: 1000000.0
  lot_size: 10
  t_plus_n: 0
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_rate: 0.0
  slippage_bps: 8.0
  fill_model:
    name: "next_bar_open"
  slippage_model: "fixed"
  portfolio_weights:
    baseline_smallcap: 0.15
    largecap_dividend: 0.15
    cb: 0.30
    bond: 0.40
  state_dir: "data/paper_state/r106_defend"
  state_file: "state.json"
  audit_log_dir: "logs/paper/r106_defend"
  monitoring_enabled: true
  alert_drawdown_threshold: 0.10
  alert_daily_loss_threshold: 0.025

pillars:
  baseline_smallcap:
    name: "小盘成长"
    strategy_name: "v19_hgro"
    market_type: "a_stock"
    weight: 0.15
    top_k: 15
    rebalance_days: 20
    buffer_k: 5
    min_mv: 20000.0
    max_mv: 300000.0
    min_turnover: 200.0
    min_listed_days: 120
    max_pb: 5.0
    vol_scaling_enabled: true
    vol_target: 0.15
    vol_lookback: 120

  largecap_dividend:
    name: "大盘高股息"
    strategy_name: "dividend_defensive"
    market_type: "a_stock"
    weight: 0.15
    top_k: 20
    rebalance_days: 20
    min_mv: 1000000.0
    max_mv: 20000000.0
    min_turnover: 500.0
    min_listed_days: 120
    max_pe: 25.0
    min_dividend_yield: 0.5
    weight_dividend: 0.35
    weight_quality: 0.25
    weight_volatility: 0.20
    weight_value: 0.10
    weight_momentum: 0.10

  cb:
    name: "双低可转债"
    strategy_name: "double_low"
    market_type: "convertible_bond"
    weight: 0.30
    top_k: 10
    rebalance_days: 5
    max_price: 135.0
    max_premium: 50.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    lot_size: 10

  bond:
    name: "债券 ETF"
    market_type: "bond"
    weight: 0.40
    rebalance_days: 20
    symbols:
      - {code: "511010.SH", weight: 0.40, duration_bucket: "treasury"}
      - {code: "511260.SH", weight: 0.30, duration_bucket: "policy_bank"}
      - {code: "511020.SH", weight: 0.30, duration_bucket: "active_treasury"}
