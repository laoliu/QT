# ============================================================
# ML 多因子选股策略 — CSI1000 (LightGBM)
# ============================================================
# 核心假说：
#   CSI1000 成分股 alpha 空间比 CSI500 更大
#   使用相同 Alpha158 + LightGBM WF 框架
#   小盘股预测力更强但需更严格的流动性约束
#
# 与 CSI500 ML 的区别：
#   - Universe: CSI1000 (1000 只小盘) vs CSI500 (500 只中盘)
#   - 参与率更低: 5% vs 8% (小盘流动性差)
#   - top_k 更大: 60 vs 50 (分散小盘风险)
#   - 最低市值更低: 3 万 vs 20 万 (千元)

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
    opening_volume_fraction: 0.1

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000852.SH
  region: CN

report:
  benchmark: 000852.SH
  metrics:
    - annual_return
    - max_drawdown
    - sharpe
    - calmar
    - turnover
    - positions_count_distribution
    - cost_impact
  output_dir: output/ml_factor_csi1000_10y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.5
  max_sector_pct: 0.20
  max_single_position_pct: 0.03
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  circuit_breaker_enabled: false
  # R94: MDD 梯度减仓 + 波动率目标
  # R94: death spiral disabled
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact
  base_bps: 8.0
  impact_coeff: 60.0
  fallback_bps: 15.0
  max_bps: 100.0

strategy:
  name: ml_factor
  parameters:
    check_index_member: false
    top_k: 60
    rebalance_days: 5
    min_mv: 30_000.0
    max_mv: 5_000_000.0
    min_price: 3.0
    max_price: 300.0
    min_turnover: 500.0
    min_listed_days: 120
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 15
    cash_reserve_pct: 0.03
    max_single_pct: 0.03
    # --- ML 参数 ---
    model_objective: regression
    model_type: lightgbm
    model_path: models/ml_csi1000_lightgbm
    train_years: 3
    predict_months: 3
    forward_days: 5
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    purge_days: 10
    # --- 回退权重 ---
    fallback_weights:
      pe_ttm: -1.0
      pb: -1.0
      roe: 1.0
      circ_mv: -0.5
      turnover_rate: -0.3

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000852.SH
  manual_exclude_list: configs/universe/exclude_list.yml
