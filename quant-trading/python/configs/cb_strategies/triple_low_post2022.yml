# TripleLow — 2022新规后分段 WF 验证
# ============================================================
# 原则 B（持续稳定性）：制度变更后的独立验证
# 数据范围: 2022-08-01 ~ 2024-12-31（新规生效后）
# ============================================================

name: "triple_low_post2022"
description: >
  三低策略 — 仅限 2022-08-01 新规后数据。
  验证策略在新涨跌停制度 (±20%) 下是否仍然有效。

data:
  source: "tushare_cb"
  start_date: "2022-08-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "triple_low"
  params:
    top_k: 20
    rebalance_days: 1
    buffer_k: 0
    max_price: 130.0
    min_price: 0.0
    max_premium: 35.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    price_weight: 0.33
    premium_weight: 0.33
    cb_value_weight: 0.34
    low_size_threshold: 30000.0
    low_size_bonus: 0.1
    stop_loss_pct: 0.10
    force_redeem_threshold: 130.0
    force_redeem_days: 8
    lot_size: 10
    exclude_called: true
    exclude_st: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk_constraints:
  force_redeem_enabled: true
  force_redeem_max_weight: 0.30
  force_redeem_cb_value_threshold: 125.0
  stop_loss_pct: 0.10
  circuit_breaker_enabled: true
  circuit_breaker_drawdown: 0.10

random_seed: 42
output_dir: "output/triple_low_post2022"
