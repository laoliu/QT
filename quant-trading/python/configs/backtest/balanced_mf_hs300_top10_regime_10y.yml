# ============================================================
# A 股均衡多因子 — HS300 集中持仓 + 择时 (10 年)
# ============================================================
# 思路：更集中的持仓(top10)放大因子alpha
# + 市场择时减少熊市损失 + regime自适应因子权重
# 从 top_k=30 集中到 top_k=10:
#   - factor alpha per stock 更高（因子排名前10% vs 前10%）
#   - 但个股风险更大（10只 vs 30只）
# 同时启用 regime_adaptive：
#   - 牛市：加动量(+8%), 减低波(-5%)
#   - 熊市：加价值(+5%), 加质量(+3%), 减动量(-8%)

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

slippage_model:
  name: fixed
  bps: 10.0

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
    opening_volume_fraction: 0.10

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000300.SH
  region: CN

report:
  benchmark: 000300.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar, turnover,
            win_rate, positions_count_distribution, cost_impact]
  output_dir: output/balanced_mf_hs300_top10_regime_10y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.50
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5
  max_sector_pct: 0.30
  max_single_position_pct: 0.15
  market_regime_enabled: true
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  circuit_breaker_enabled: true

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

strategy:
  name: balanced_multifactor
  parameters:
    top_k: 10
    rebalance_days: 20
    min_mv: 300_000.0
    max_mv: 50_000_000.0
    min_price: 5.0
    max_price: 500.0
    min_turnover: 2000.0
    min_listed_days: 120
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 5
    cash_reserve_pct: 0.03
    max_single_pct: 0.15
    inverse_vol_weighting: true
    weight_value: 0.25
    weight_quality: 0.25
    weight_momentum: 0.25
    weight_volatility: 0.25
    weight_dividend: 0.0
    weight_earnings_growth: 0.0
    momentum_lookback: 60
    momentum_skip_recent: 5
    momentum_multi_period: true
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe
    regime_adaptive: true
    base_index: 000300.SH

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000300.SH
  manual_exclude_list: configs/universe/exclude_list.yml
