# CBGammaConvexity v1 — Delta 凸性可转债策略
# ============================================================
# 做多平衡区 CB 的 Gamma 凸性。理论基础：
#   - Gamma = dΔ/dS 在 ATM (Delta≈0.5) 附近最大
#   - 持有高 Gamma CB = 做多正股波动率
#   - 正股每波动 1%，CB 涨幅 > 跌幅（非对称收益）
#
# 因子矩阵（4+1 因子）：
#   gamma_proxy(0.25) + premium(0.25) + stock_vol(0.25)
#   + price(0.15) + issue_size(0.10)
#
# 关键过滤：
#   - 仅保留 Delta ∈ [0.25, 0.75] 的平衡区 CB
#   - max_issue_size = inf（不依赖小规模效应）
#   - min_days_to_maturity = 60（到期太近凸性有限）
# ============================================================

name: "cb_gamma_convexity_v1_7y"
description: >
  Delta 凸性可转债策略 v1。
  做多平衡区（高 Gamma）+ 高正股波动 + 低溢价的可转债。
  4+1 因子：gamma_proxy + premium + stock_vol + price + issue_size(弱)。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_gamma_convexity"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 160.0
    max_issue_size: .inf
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 60
    exclude_st: true
    stop_loss_pct: 0.20
    lot_size: 10
    # --- Delta 区间过滤 ---
    delta_min: 0.25
    delta_max: 0.75
    # --- 次新过滤 ---
    use_age_filter: true
    min_age_days: 3
    # --- 溢价率过滤 ---
    max_premium: 60.0
    # --- 4+1 因子权重 ---
    weight_gamma: 0.25
    weight_premium: 0.25
    weight_stock_vol: 0.25
    weight_price: 0.15
    weight_issue_size: 0.10
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.12
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/cb_gamma_convexity_v1_7y"
