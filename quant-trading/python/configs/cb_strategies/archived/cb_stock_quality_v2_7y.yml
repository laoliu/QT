# CBStockQuality v2 — 参数优化版（先验经济理论驱动）
# ============================================================
# 基于 v1 (AR=12.5%, SR=0.76) 的经济学先验优化版本。
#
# v1→v2 变更理据：
#   1. top_k 15→5: 每日仅5-10只高alpha CB，集中持仓捕获截面alpha
#      (参考 double_low_plus_v4 top_k=5 实现 36.8% AR)
#   2. rebalance_days 5→1: CB T+0市场，信号半衰期3-5天，日频成本极低
#   3. max_issue_size ∞→20000: 小盘CB低机构覆盖→定价偏差→alpha
#      (sweep灵敏度分析: sz=20000 avg AR=22.7% >> sz=15000 avg=5.1%)
#   4. weight_issue_size 0.10→0.25: 提升最强alpha因子，保持多因子结构
#   5. max_premium 80→60: 低溢价率增强股性，使L2因子(ROE/EP/Vol)更有效
#   6. stop_loss_pct 0.25→0.10: 收紧风控，对齐 top performers
#
# 因子矩阵（5+1 因子，双层结构不变）：
#   Layer 1 (CB本体): price(0.18) + premium(0.12)
#   Layer 2 (正股质量): stock_roe(0.20) + stock_ep(0.15) + stock_vol(0.10)
#   Structural: issue_size(0.25)
#   → 总权重 = 1.00
#
# 关键差异化因子 vs 简单小盘策略：
#   stock_roe (正股ROE): 筛选盈利能力强的正股，提升转股价值确定性
#   stock_ep  (正股EP):  筛选低估值正股，增加安全边际
#   stock_vol (正股波动): 高波动正股→Gamma价值→CB上行弹性
# ============================================================

name: "cb_stock_quality_v2_7y"
description: >
  正股质量加强型CB策略 v2（先验经济理论优化）。
  5+1 因子: price(0.18) + premium(0.12) + stock_roe(0.20) + stock_ep(0.15)
  + stock_vol(0.10) + issue_size(0.25)。
  集中持仓(top_k=5) + 小盘筛选(sz≤20000) + 日频调仓。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality"
  params:
    # --- 结构参数（先验理论驱动） ---
    top_k: 5
    rebalance_days: 1
    # --- 过滤参数 ---
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 60.0
    # --- Layer 1 权重 (CB 本体，合计 0.30) ---
    weight_price: 0.18
    weight_premium: 0.12
    # --- Layer 2 权重 (正股质量，合计 0.45) ---
    weight_stock_roe: 0.20
    weight_stock_ep: 0.15
    weight_stock_vol: 0.10
    # --- Structural (规模因子，0.25) ---
    weight_issue_size: 0.25
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true
    default_roe: 0.0
    default_ep: 0.0

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42

output_dir: "output/cb_stock_quality_v2_7y"
