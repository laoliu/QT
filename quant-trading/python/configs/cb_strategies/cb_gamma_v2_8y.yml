# Gamma凸性策略 v2 — 8年回测 (统一 linear_impact)
# ============================================================
# 经济学基础: CB = 债券 + 看涨期权(正股)
#   - Gamma最大 → ATM区(Delta≈0.5), 正股小幅波动就有超额收益
#   - 高正股波动率 → 期权价值高 → CB被低估的概率大
#   - 低溢价 → 市场低估期权价值
# v2 调整:
#   - rebalance_days: 5 (周频)
#   - delta区间 [0.25, 0.75] (聚焦平衡区)
#   - 弱化 issue_size (0.10→0.05)
#   - 提升 gamma 和 stock_vol 权重
# ============================================================

name: "cb_gamma_v2_8y"
description: >
  Gamma凸性策略 v2 — 择时ATM区, 打Gamma收益。
  5因子: gamma(0.30)+premium(0.25)+stock_vol(0.25)+price(0.15)+size(0.05)。
  delta过滤[0.25,0.75], 周频调仓。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_gamma_convexity"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 160.0
    min_turnover: 20.0
    min_days_to_maturity: 60
    stop_loss_pct: 0.20
    delta_min: 0.25
    delta_max: 0.75
    use_age_filter: true
    min_age_days: 3
    max_premium: 60.0
    # 5因子权重 (提升gamma+vol, 弱化size)
    weight_gamma: 0.30
    weight_premium: 0.25
    weight_stock_vol: 0.25
    weight_price: 0.15
    weight_issue_size: 0.05
    # 正股数据
    vol_lookback: 60
    use_stock_bridge: true
    lot_size: 10
    exclude_st: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_gamma_v2_8y"

report:
  benchmark: "000300.SH"
