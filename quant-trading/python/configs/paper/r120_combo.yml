# R120 四组件跨资产组合 — CB容量约束修正版
# ====================================================================
# 方案: R120 capacity_aware (ML2000:50/ML1000:20/CB:5/ETF:25)
# 基于 R119 CB容量深度评估:
#   - CB 合理容量 ≤50万, R117分配400万超载8-20倍
#   - Post-2022 CB平均持仓仅2-3只, 2025年1.5只, 2026年0.6只
#   - CB资金利用率2025年仅33.7%, 2026年仅10.5%
#   - 释放350万给高容量ML策略 → 提升有效资金利用率
# 组件:
#   ┌──────────────────────┬──────┬──────────┬──────────────┐
#   │ 组件                  │ 权重 │ AR(回测)  │ 调仓频率      │
#   ├──────────────────────┼──────┼──────────┼──────────────┤
#   │ ML CSI2000 Fund       │  50% │ ~19.8%   │ 5 交易日      │
#   │ ML CSI1000 Fund       │  20% │ ~50.0%*  │ 5 交易日      │
#   │ CB Stock Quality      │   5% │ ~21.0%   │ 每交易日      │
#   │ ETF Cross V6 FAA      │  25% │ ~12.0%   │ 10 交易日     │
#   └──────────────────────┴──────┴──────────┴──────────────┘
#   * ML1000 全期AR虚高,近3年均~5%,已严重衰减
# ====================================================================
# 新增: 资金量感知权重自动调整 (CapacityAwareAllocator)
# ====================================================================

profile_name: "r120_combo"
description: >
  R120 四组件跨资产组合 — CB容量修正版
  CB从40%降至5%(50万), 释放资金给ML策略
  日频 TuShare EOD 批处理模拟盘

initial_capital: 10000000.0  # 1000万

# ── 组合权重 (R120 容量修正) ──
portfolio_weights:
  ml_csi2000: 0.50   # R117: 0.30 → 0.50 (+20pp, 主力策略增配)
  ml_csi1000: 0.20   # R117: 0.10 → 0.20 (+10pp, 分散化补偿)
  cb: 0.05            # R117: 0.40 → 0.05 (-35pp, 容量上限50万)
  etf: 0.25           # R117: 0.20 → 0.25 (+5pp, 流动性缓冲)

# ── 资金量感知权重自动调整 ──
capacity_aware:
  enabled: true
  cb_max_capital: 500000       # CB最大分配50万元
  cb_min_weight: 0.02          # CB最低权重2%
  redistribution_rule: "proportional"  # 超出部分按比例分配给其他组件

# ── MDD 梯度减仓 overlay ──
mdd_gradient:
  enabled: false
  levels:
    - [0.05, 0.80]
    - [0.10, 0.60]
    - [0.15, 0.40]
    - [0.20, 0.25]
    - [0.25, 0.10]

# ── ML CSI2000 Fund 配置 ──
ml_csi2000:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi2000_lgb_fund"
  universe: "csi2000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── ML CSI1000 Fund 配置 (增配至20%) ──
ml_csi1000:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi1000_lgb_fund"
  universe: "csi1000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── CB Stock Quality 配置 (降配至5%) ──
cb:
  asset_type: "convertible_bond"
  top_k: 10
  rebalance_freq: "daily"
  max_price: 145.0
  max_issue_size: 20000.0
  min_turnover: 20.0
  max_premium: 60.0
  min_age_days: 3
  min_days_to_maturity: 30
  factor_weights:
    price: 0.18
    premium: 0.12
    stock_roe: 0.25
    stock_ep: 0.20
    stock_vol: 0.15
    issue_size: 0.10
  lot_size: 10
  commission_rate: 0.0000854
  commission_min: 5.0
  slippage_bps: 5.0

# ── ETF Cross V6 FAA 配置 ──
etf:
  asset_type: "etf"
  top_k: 3
  rebalance_freq: "every_10d"
  symbols:
    - "510300.SH"
    - "510500.SH"
    - "159915.SZ"
    - "512100.SH"
    - "510050.SH"
    - "510880.SH"
    - "512010.SH"
    - "512690.SH"
    - "512660.SH"
    - "513100.SH"
    - "159920.SZ"
    - "518880.SH"
    - "511010.SH"

# ── 组合健康监控配置 ──
monitoring:
  risk_contribution:
    ml_csi2000_max: 0.55
    ml_csi2000_warn: 0.50
    check_frequency: weekly
  alpha_decay:
    rolling_sr_window: 252
    sr_threshold: 0.0
    max_consecutive_months: 6
    check_frequency: monthly
  drawdown:
    warn_level: -0.15
    halt_level: -0.20
  pbo_review:
    max_pbo: 0.50
    min_decay_ratio: 0.25
    check_frequency: quarterly
