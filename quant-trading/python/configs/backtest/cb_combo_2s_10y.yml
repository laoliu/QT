# CB 双策略优化组合 — 10年回测（B4b）
# ============================================================
# 依据 B2 相关性分析：
#   - cb_comprehensive vs double_low_plus = 0.983（过高，剔除重叠策略）
#   - small_size与多因子类相关 ≈ 0.69（尚可接受，但需更低相关性）
#
# 本配置选择：
#   - small_size (65%)：10y WF score=7.23，AR=20.27%，最稳健
#   - cb_multi_alpha (35%)：10y MDD=13.44%（最低！），因子逻辑完全不同
#     （size+momentum+surge+premium+price 5因子 vs 纯规模排序）
#
# 模式：fixed_weight（固定权重），保留对最优策略的主导地位
# ============================================================

name: "cb_combo_2s_10y"
description: >
  CB 双策略优化组合（B4b）。small_size 主导(65%) + cb_multi_alpha 分散(35%)，
  低相关性降低组合回撤，同时保留 small_size 的高 Sharpe 特性。

data:
  source: "tushare_cb"
  start_date: "2015-01-01"
  end_date:   "2024-12-31"
  frequency:  "1d"
  adjust:     "none"
  cache_dir:  "data/cache/cb_tushare"

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 10.0

trading_rules:
  t_plus_n: 0
  lot_size: 10
  allow_short: false

initial_capital: 1000000.0    # 100万（smaller = more realistic）
random_seed: 42
output_dir: "output/cb_combo_2s_10y"

universe_policy:
  name: "cb_default"
  auto_exclude:
    - "ST"
    - "DELISTING"
    - "SUSPENDED_LONG"
    - "FORCE_REDEEMED"
    - "NEAR_MATURITY"
  manual_exclude_list: "configs/universe/exclude_list.yml"

portfolio:
  allocation_mode: "fixed_weight"   # 固定权重：保留对最优策略的主导
  rebalance_freq: 20

  strategies:
    # ── S1: SmallSize — 10y 年化最高，WF score 最高 ──────────────────────
    - name: "small_size"
      weight: 0.65
      config:
        top_k: 20
        rebalance_days: 1
        buffer_k: 0
        max_price: 130.0
        max_issue_size: 50000.0
        min_turnover: 20.0
        min_days_to_maturity: 30
        stop_loss_pct: 0.15
        force_redeem_threshold: 130.0
        force_redeem_days: 8
        lot_size: 10
        exclude_called: true
        exclude_st: true

    # ── S2: CBMultiAlpha — 5因子融合，MDD 最低(13.44%)，分散化 ───────────
    - name: "cb_multi_alpha"
      weight: 0.35
      config:
        top_k: 8
        rebalance_days: 1
        buffer_k: 3
        max_price: 150.0
        max_issue_size: 20000.0
        min_issue_size: 0.0
        min_turnover: 10.0
        min_days_to_maturity: 60
        exclude_st: true
        exclude_called: true
        max_premium: 80.0
        momentum_lookback: 10
        surge_lookback: 20
        warmup_bars: 25
        w_size: 0.30
        w_momentum: 0.20
        w_surge: 0.20
        w_premium: 0.15
        w_price: 0.15
        stop_loss_pct: 0.12
        min_positions: 3
        lot_size: 10

risk_control:
  market_regime:
    enabled: true
    index: "000932.CSI"
    bull_threshold: 0.08
    bear_threshold: -0.06
    high_vol_threshold: 0.025
    actions:
      BEAR:
        position_scale: 0.55
      BULL:
        position_scale: 1.0
      NEUTRAL:
        position_scale: 0.85

  force_redeem_exposure:
    enabled: true
    max_weight: 0.30
    cb_value_threshold: 125.0

  drawdown_limit:
    enabled: true
    max_drawdown: 0.20
    soft_limit: 0.15
    hard_limit: 0.25
    recovery_days: 10

  concentration:
    enabled: true
    max_single_strategy_weight: 0.70
    min_active_strategies: 2
