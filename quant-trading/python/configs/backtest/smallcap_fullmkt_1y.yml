# A 股小盘轮动 — 全市场极激进版 (2024 年验证)
# 目标: 验证全 A 小盘溢价，无 HS300 限制
#
# 用现有 2024 年全市场缓存数据做快速验证
# base_index 为空 → 全市场选股
# 目标市值区间: 20-100亿 (真正的小盘股)

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05
data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare
fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
frequency:
  data_frequency: 1d
  matching_resolution: 1d
initial_capital: 1000000
market:
  instruments:
    asset_type: stock
    boards:
    - A
  region: CN
report:
  benchmark: 000905.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar, turnover, win_rate,
            positions_count_distribution, cost_impact]
  output_dir: reports/smallcap_fullmkt_1y
  universe_summary: true
risk_constraints:
  max_drawdown_pct: 0.60
  max_sector_pct: 0.40
  max_single_position_pct: 0.12
  market_regime_enabled: false
  stop_loss_pct: 0.50
  trailing_stop_pct: 0.0
  momentum_skip_recent: 1
  momentum_multi_period: true
  inverse_vol_weighting: false
  circuit_breaker_enabled: false
run:
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  start_date: '2024-01-02'
  timezone: Asia/Shanghai
slippage_model:
  bps: 5
  name: fixed_bps
strategy:
  name: smallcap_rotation
  parameters:
    top_k: 10
    rebalance_days: 5
    min_mv: 200000.0
    max_mv: 1000000.0
    min_price: 3.0
    max_price: 9999.0
    min_turnover: 500.0
    min_listed_days: 120
    stop_loss_pct: 0.50
    buffer_k: 3
    cash_reserve_pct: 0.02
    max_single_pct: 0.12
    momentum_lookback: 20
    volatility_lookback: 20
    momentum_invert: false
    momentum_skip_recent: 1
    momentum_multi_period: true
    regime_adaptive: false
    weight_small_cap: 0.45
    weight_momentum: 0.30
    weight_turnover: 0.00
    weight_volatility: 0.10
    weight_quality: 0.10
    weight_value: 0.05
trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1
universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  manual_exclude_list: configs/universe/exclude_list.yml
