name: "triple_low"

description: >

  三低策略扩展回测 �?2018-2025 覆盖完整可转债牛熊周�?


data:

  source: "tushare_cb"

  start_date: "2018-01-01"

  end_date: "2024-12-31"

  frequency: "1d"

  adjust: "none"

  cache_dir: "data/cache/cb_tushare"



strategy:

  name: "triple_low"

  params:

    top_k: 20

    rebalance_days: 1

    buffer_k: 0

    max_price: 130.0

    min_price: 0.0

    max_premium: 35.0

    min_issue_size: 0.0

    min_turnover: 20.0

    min_days_to_maturity: 30

    price_weight: 0.33

    premium_weight: 0.33

    cb_value_weight: 0.34

    low_size_threshold: 30000.0

    low_size_bonus: 0.1

    stop_loss_pct: 0.10

    force_redeem_threshold: 130.0

    force_redeem_days: 8

    lot_size: 10

    exclude_called: true

    exclude_st: true



fill_model:

  name: "next_bar_open"

  volume_constraint:

    max_participation_rate: 0.10
    opening_volume_fraction: 0.15

    lot_size: 10



