# 低溢价率轮动策略 — 默认配置
# ============================================================
# 策略逻辑: 持有溢价率最低的 top_k 只转债，追求最大正股弹性
# 低溢价 = 转债与正股联动最紧密，向上弹性最大
# ============================================================

name: "low_premium"
description: >
  低溢价率轮动策略 — 持有溢价率最低的 top_k 只转债，追求最大正股弹性。
  溢价率越低，转债与正股联动越紧密，向上弹性越大。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "low_premium"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 150.0               # 低溢价转债价格可能偏高，放宽上限
    max_premium: 50.0              # 初步筛选溢价率上限
    min_turnover: 30.0             # 流动性门槛 (万元)
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/low_premium"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
