name: "new_small_optimized"

description: >

  次新小盘复合策略（优化版）�?放宽 DrawdownLimit 以避免集中持仓反馈循环�?
  在次新债中精选发行规模最小的 5 只，日频调仓�?


# ------ 数据 ------

data:

  source: "tushare_cb"

  start_date: "2018-01-01"

  end_date: "2024-12-31"

  frequency: "1d"

  adjust: "none"

  cache_dir: "data/cache/cb_tushare"



# ------ 策略 ------

strategy:

  name: "new_small"

  params:

    top_k: 5

    rebalance_days: 1

    min_age_days: 5

    max_age_days: 90

    max_issue_size: 60000.0       # 万元 (6亿以�?

    max_price: 150.0

    min_turnover: 10.0            # 最低成交额 10 �?(放宽以增加候�?

    exclude_st: true

    stop_loss_pct: 0.10  # CB��ծ�ױ���,10%ֹ�������(�޸�F-R3)           # 宽松止损 (可转债有债底保护)

    min_positions: 1              # 允许少于 k 只时仍开�?
    lot_size: 10



# ------ 成交模型 ------

fill_model:

  name: "next_bar_open"

  volume_constraint:

    max_participation_rate: 0.10
    opening_volume_fraction: 0.15

    lot_size: 10



# ------ 成本 (可转�? ------

cost:

  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond

  commission_min: 5
  stamp_tax_rate: 0.0

  transfer_fee_rate: 0.0

  slippage_bps: 5.0               # 保守滑点 (策略�?8bps 下仍 38.96%)



# ------ 资金与规�?------

initial_capital: 500000.0

lot_size: 10

t_plus_n: 0



# ------ 风控约束 ------

# 核心修正: max_drawdown 从默�?0.20 放宽�?0.50

# 原因: 默认 dd=0.20 �?k=5 集中持仓下触�?reduce_position_at=0.10�?
#        导致策略在正常波动中被禁止开仓，年化�?40% 跌至 2.6%�?
# 可转债有债底保护 (100 面�?+ 转股溢价)�?0% 回撤已属极端�?
risk:

  enabled: true

  max_position_weight: 0.25       # k=5 等权 20%/�? �?5% 缓冲

  max_drawdown: 0.50              # 放宽回撤限制, 避免反馈循环

  enable_audit_log: true



# ------ 实验指纹 ------

random_seed: 42



# ------ 输出 ------

output_dir: "output/new_small_optimized"

