# ============================================================
# CSI300 ML 策略 — Universe 修复诊断
# ============================================================
# 目的：跳过 is_index_member 过滤，使引擎从全部历史成分中选股
# 对比基线：norisk_diag (overlap=8/30, AR=-3.4%)
# 预期：overlap→24/30, 理论收益从0.457%→0.883%/期
# ============================================================

cost_model:
  commission:
    min_fee: 5.0
    rate: 0.0000854
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
    opening_volume_fraction: 0.1

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000300.SH
  region: CN

report:
  benchmark: 000300.SH
  metrics:
    - annual_return
    - max_drawdown
    - sharpe
    - calmar
    - turnover
  output_dir: output/ml_csi300_universe_fix
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 1.0
  max_sector_pct: 1.0
  max_single_position_pct: 1.0
  stop_loss_pct: 0
  trailing_stop_pct: 0
  circuit_breaker_enabled: false
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2018-01-16'
  end_date: '2025-12-15'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact
  base_bps: 8.0
  impact_coeff: 40.0
  fallback_bps: 15.0
  max_bps: 50.0

strategy:
  name: ml_factor
  parameters:
    top_k: 30
    rebalance_days: 5
    check_index_member: false  # 关键修复：不限制当期成分
    min_price: 3.0
    max_price: 300.0
    min_turnover: 500.0
    min_listed_days: 120
    min_mv: 100000             # 10亿 (默认)
    stop_loss_pct: 0
    trailing_stop_pct: 0
    buffer_k: 0                # 纯OOS排名
    cash_reserve_pct: 0.03
    max_single_pct: 1.0
    model_objective: regression
    model_type: lightgbm
    model_path: models/ml_csi300_lgb_p3
    oos_predictions_path: models/ml_csi300_lgb_p3/oos_predictions.parquet
    train_years: 3
    predict_months: 3
    forward_days: 5
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    purge_days: 10
