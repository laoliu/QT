# 真实数据回测配置示例：动量策略 + TuShare 日线数据
# 用于验证系统端到端闭环（真实数据）
#
# 用法: python -m aipha backtest --config configs/backtest/examples/momentum_tushare.yml

name: "momentum_tushare_daily"
description: |
  使用 TuShare Pro 日线数据的动量策略回测
  - 数据源：TuShare Pro
  - 频率：日线
  - 范围：沪深300成分股中选取部分股票

# ============================================================================
# 数据配置（TuShare Pro）
# ============================================================================
data:
  source: "tushare"  # 使用 TuShare 数据
  start_date: "2024-01-01"
  end_date: "2024-06-30"  # 6个月
  frequency: "daily"
  symbols:
    - "000001.SZ"  # 平安银行
    - "000002.SZ"  # 万科A
    - "000063.SZ"  # 中兴通讯
    - "000333.SZ"  # 美的集团
    - "600036.SH"  # 招商银行
    - "600519.SH"  # 贵州茅台

# ============================================================================
# 股票池配置
# ============================================================================
universe:
  policy: "a_share_default"
  exclude_st: true
  exclude_suspended: true
  exclude_limit: true
  min_listing_days: 60

# ============================================================================
# 策略配置
# ============================================================================
strategy:
  name: "momentum"  # 使用注册表中的 momentum 策略
  params:
    lookback_days: 20  # 20日动量
    top_k: 3  # 持仓3只
    rebalance_days: 5  # 每周调仓

# ============================================================================
# 成本配置（A股真实成本）
# ============================================================================
cost:
  commission_rate: 8.54e-05  # §13.1 MarketRulesCNEquity 万一佣金
  commission_min: 5.0
  stamp_tax_rate: 0.0005  # 2023-08-28 起印花税减半：千分之0.5（卖出）
  transfer_fee_rate: 0.00001
  slippage_bps: 10.0  # §13.1 MarketRulesCNEquity A股默认10bps

# ============================================================================
# 回测设置
# ============================================================================
initial_capital: 1000000.0
lot_size: 100
t_plus_n: 1
random_seed: 42
output_dir: "output/tushare_momentum"
