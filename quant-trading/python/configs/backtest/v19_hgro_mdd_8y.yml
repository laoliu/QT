# v19_hgro + MDD 梯度风控 — 日频事件驱动回测
# 基于 v19_hgro_8y.yml，启用 MDD 梯度减仓 + 波动率缩放
# R113 专家评审紧缩: 目标 MDD ≤ 25%，启用 vol_scaling
#
# MDD 梯度逻辑（迟滞机制，紧缩版）:
#   MDD > 12% → 减仓至 70% (level 1)
#   MDD > 18% → 减仓至 40% (level 2)
#   MDD < 6%  → 恢复满仓

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards:
    - A
  region: CN

report:
  benchmark: 000905.SH
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  output_dir: output/v19_hgro_mdd_8y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.40
  max_sector_pct: 1.0
  max_single_position_pct: 0.10

run:
  end_date: '2025-12-31'
  mode: backtest
  seed: 42
  start_date: '2018-01-02'
  timezone: Asia/Shanghai

slippage_model:
  name: fixed_bps
  bps: 20.0

strategy:
  name: v19_hgro
  parameters:
    top_k: 15
    rebalance_days: 20
    buffer_k: 5
    min_mv: 20000.0
    max_mv: 300000.0
    min_price: 2.0
    max_price: 100.0
    min_turnover: 200.0
    min_listed_days: 120
    max_pb: 5.0
    weight_small_size: 0.40
    weight_momentum: 0.25
    weight_growth: 0.20
    weight_ep: 0.10
    weight_bp: 0.05
    momentum_lookback: 240
    momentum_skip_recent: 20
    vol_scaling_enabled: true
    vol_target: 0.18
    vol_lookback: 60
    # === MDD 梯度风控（R113 紧缩: 早触发、强减仓）===
    mdd_gradient_enabled: true
    dd_level1_threshold: 0.12
    dd_level1_scale: 0.70
    dd_level2_threshold: 0.18
    dd_level2_scale: 0.40
    dd_restore_threshold: 0.06

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  manual_exclude_list: configs/universe/exclude_list.yml
