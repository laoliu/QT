# 可转债 IVOL-价值策略 — 8年回测配置
# ============================================================
# 策略逻辑: 融合特异波动率 (IVOL)、52 周高点距离、Theta 代理、
#           偏度等正交因子，与传统价格/溢价率因子加权融合。
#
# Alpha 来源:
#   - IVOL (Ang 2006): 低 IVOL 标的有正超额收益
#   - 52w 高点距离 (George & Hwang 2004): 锚定效应动量
#   - Theta 代理: CB 特有时间价值衰减因子
#   - 收益率偏度: 正偏度有利于多头
#
# 设计目标:
#   - 与 triple_low/small_size 等现有策略低相关 (corr < 0.5)
#   - 新因子维度权重 ≥ 50%，突破 price/premium/size 维度依赖
# ============================================================

name: "cb_ivol_value_8y"
description: >
  IVOL-价值策略 — 融合特异波动率、52w 高点距离、Theta 代理等正交因子。
  目标：产出与 triple_low/small_size 低相关的 alpha 信号。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "cb_ivol_value"
  params:
    top_k: 20
    rebalance_days: 5

    # 传统因子权重（基底，但降权 ≤ 30%）
    price_weight: 0.15               # 低价格更优
    premium_weight: 0.10             # 低溢价率更优

    # 正交因子权重（核心差异化来源 ≥ 55%）
    ivol_weight: 0.20                # 低特异波动率更优
    high_distance_weight: 0.15       # 接近 52w 高点更优
    theta_weight: 0.10               # 高 Theta 代理更优
    skewness_weight: 0.10            # 正偏度更优

    # 尺度因子
    size_weight: 0.20                # 小规模更优

    # Tracker 参数
    ivol_lookback: 20
    ivol_min_obs: 10
    high_distance_lookback: 252
    skewness_lookback: 20
    skewness_min_obs: 10

    # 筛选
    max_price: 135.0
    min_turnover: 50.0
    min_days_to_maturity: 60
    exclude_st: true

    # 风控
    stop_loss_pct: 0.12
    buffer_k: 3
    force_redeem_threshold: 130.0
    force_redeem_days: 8
    lot_size: 10
    exclude_called: true

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债，使用 linear_impact) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0                    # CB 最低买卖价差
    impact_coeff: 50.0               # 参与率每增加1%，额外增加50bps
    fallback_bps: 8.0                # 无成交量数据时的回退值
    max_bps: 40.0                    # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/cb_ivol_value_8y"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
