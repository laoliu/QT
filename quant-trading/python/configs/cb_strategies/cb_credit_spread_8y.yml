# 信用利差因子策略 8 年回测配置
# CB Credit Spread Factor Strategy — 债性维度 Alpha
#
# 核心创新：YTM + 信用评级 + 债底距离 → 债性因子维度
# 预期与 triple_low/small_size 正交（股性 vs 债性）

name: "cb_credit_spread_8y"
description: >
  信用利差因子策略 — YTM + 信用评级 + 债底距离评分。
  捕获债性维度 Alpha，与现有股性因子正交。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2025-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_credit_spread"
  params:
    top_k: 20
    rebalance_days: 5
    max_price: 150.0
    min_turnover: 20.0
    min_days_to_maturity: 60
    stop_loss_pct: 0.20
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 100.0
    weight_ytm: 0.25
    weight_rating: 0.15
    weight_bond_floor: 0.15
    weight_price: 0.20
    weight_premium: 0.15
    weight_issue_size: 0.10
    ytm_mode: "enhanced"

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_credit_spread_8y"

report:
  benchmark: "000300.SH"
