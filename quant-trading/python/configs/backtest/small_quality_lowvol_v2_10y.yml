# 小盘质量低波 v2 — CSI800 成分 10年回测
# R14 专家诊断修正版
# 修正 v1 失败根因：
#   1) trailing_stop 10% → 禁用（小盘波动大，频繁误触）
#   2) stop_loss 15% → 25%（小盘常态波动 15-20%）
#   3) 全市场 → CSI800（数据质量好，因子覆盖完整）
#   4) top_k 20 → 30（增加分散度）

cost_model:
  commission: {min_fee: 5.0, rate: 0.0003}
  stamp_tax: {sell_rate: 0.0005}
  transfer_fee: {rate: 1.0e-05}

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
    opening_volume_fraction: 0.10

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000906.SH
  region: CN

report:
  benchmark: 000906.SH
  output_dir: output/small_quality_lowvol_v2_10y

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 40.0
  fallback_bps: 12.0
  max_bps: 60.0

strategy:
  name: balanced_multifactor
  parameters:
    top_k: 30
    rebalance_days: 15
    min_mv: 200000.0
    max_mv: 3000000.0
    min_price: 5.0
    max_price: 200.0
    min_turnover: 800.0
    min_listed_days: 250
    buffer_k: 10
    weight_size: 0.25
    weight_volatility: 0.25
    weight_quality: 0.25
    weight_turnover: 0.15
    weight_value: 0.10
    weight_momentum: 0.0
    weight_str: 0.0
    weight_dividend: 0.0
    weight_earnings_growth: 0.0
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe
    stop_loss_pct: 0.25
    trailing_stop_pct: 0.0
    inverse_vol_weighting: true
    max_single_pct: 0.05
    cash_reserve_pct: 0.03
    max_industry_pct: 0.15

risk_constraints:
  max_drawdown_pct: 0.50
  drawdown_peak_reset_days: 60
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000906.SH
