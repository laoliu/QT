# CSI1000 极端反转 — top5 集中 + 5日lookback (8年回测)
# 目标30%年化：极端集中 + 超短反转 + 小盘偏重
# 风险：单年可能 -40%+ 回撤

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05
data:
  base_index: '000852.SH'
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare
fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.03
    lot_size: 100
frequency:
  data_frequency: 1d
  matching_resolution: 1d
initial_capital: 1000000
market:
  instruments:
    asset_type: stock
    boards:
    - A
  region: CN
report:
  benchmark: 000852.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar, turnover]
  output_dir: reports/csi1000_extreme_reversal_8y
  universe_summary: true
risk_constraints:
  max_drawdown_pct: 0.70
  max_sector_pct: 0.50
  max_single_position_pct: 0.25
  market_regime_enabled: false
  stop_loss_pct: 0.60
  trailing_stop_pct: 0.0
  circuit_breaker_enabled: false
run:
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  start_date: '2016-01-04'
  timezone: Asia/Shanghai
slippage_model:
  bps: 8
  name: fixed_bps
strategy:
  name: smallcap_rotation
  parameters:
    top_k: 5
    rebalance_days: 3
    min_mv: 0.0
    max_mv: 3000000.0
    min_price: 3.0
    max_price: 9999.0
    min_turnover: 300.0
    min_listed_days: 120
    stop_loss_pct: 0.60
    buffer_k: 1
    cash_reserve_pct: 0.01
    max_single_pct: 0.25
    momentum_lookback: 5
    volatility_lookback: 10
    momentum_invert: true
    momentum_skip_recent: 0
    momentum_multi_period: false
    regime_adaptive: false
    weight_small_cap: 0.35
    weight_momentum: 0.45
    weight_turnover: 0.00
    weight_volatility: 0.10
    weight_quality: 0.05
    weight_value: 0.05
trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1
universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  manual_exclude_list: configs/universe/exclude_list.yml
