# CB低波动质量策略 — 7年回测配置 (v2)
# v1失败原因: 反转因子买了大量价值陷阱(负总收益)
# v2改进: 去掉反转, 加入正股ROE质量因子 + 小规模因子
# 经济学理论: 低波动异象(Ang2006) + ROE质量(Novy-Marx2013) + carry(YTM)
# 

name: "cb_low_vol_reversion_v2_7y"
description: >
  CB低波动质量carry策略v2: 低波动+正股ROE+债底距离+低溢价+小规模.
  去掉v1的反转因子(导致买入价值陷阱). 周频调仓.

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_low_vol_reversion"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 135.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.15
    lot_size: 10
    buffer_k: 5
    max_premium: 50.0
    use_age_filter: true
    min_age_days: 5
    # 因子权重 (v2: 无反转, 加ROE+规模)
    weight_low_vol: 0.30
    weight_reversal: 0.0          # 禁用反转
    weight_bond_floor: 0.20
    weight_premium: 0.15
    weight_stock_roe: 0.20        # 正股质量
    weight_issue_size: 0.15       # 小规模溢价
    # 因子参数
    vol_lookback: 20
    reversal_lookback: 10
    use_stock_bridge: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/cb_low_vol_reversion_v2_7y"
