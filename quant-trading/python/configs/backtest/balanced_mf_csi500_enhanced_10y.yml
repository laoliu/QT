# ============================================================
# A 股均衡多因子增强策略 — CSI500 选股 (10 年回测)
# ============================================================
# 核心假说：
#   1) CSI500 中盘股(50-300亿)流动性充足但机构覆盖度低，存在定价错误
#   2) size + STR + quality + low_vol 四因子在 A 股实证中有效性最强
#   3) 去掉中期动量(A股中弱)，替换为短期反转(A股中强)
#   4) 加入低换手因子捕捉散户投机回避溢价
# 改进 vs balanced_mf_hs300(13.54% AR):
#   - CSI500(500只) vs HS300(300只)：更宽选股域，更多alpha机会
#   - 加入 size(20%) + STR(15%) + low_turnover(10%)
#   - 去掉 momentum(0%) 避免A股动量反转的对冲
#   - 调仓10天(双周) vs 20天：更快捕捉反转信号

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.08
    lot_size: 100
    opening_volume_fraction: 0.1

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000905.SH
  region: CN

report:
  benchmark: 000905.SH
  metrics:
    - annual_return
    - max_drawdown
    - sharpe
    - calmar
    - turnover
    - win_rate
    - positions_count_distribution
    - cost_impact
  output_dir: output/balanced_mf_csi500_enhanced_10y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.5
  max_sector_pct: 0.3
  max_single_position_pct: 0.06
  market_regime_enabled: false
  stop_loss_pct: 1.0
  trailing_stop_pct: 1.0
  circuit_breaker_enabled: false
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5

run:
  start_date: '2015-01-05'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 40.0
  fallback_bps: 10.0
  max_bps: 80.0

strategy:
  name: balanced_multifactor
  parameters:
    top_k: 25
    rebalance_days: 10
    min_mv: 300_000.0
    max_mv: 5_000_000.0
    min_price: 3.0
    max_price: 500.0
    min_turnover: 1000.0
    min_listed_days: 120
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 10
    cash_reserve_pct: 0.03
    max_single_pct: 0.06
    inverse_vol_weighting: true
    # --- 因子权重 (合计=1.0) ---
    weight_value: 0.10
    weight_quality: 0.25
    weight_momentum: 0.0
    weight_volatility: 0.20
    weight_dividend: 0.0
    weight_earnings_growth: 0.0
    weight_turnover: 0.10
    weight_size: 0.20
    weight_str: 0.15
    # --- 因子参数 ---
    str_lookback: 5
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe
    regime_adaptive: false
    base_index: 000905.SH

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000905.SH
  manual_exclude_list: configs/universe/exclude_list.yml
