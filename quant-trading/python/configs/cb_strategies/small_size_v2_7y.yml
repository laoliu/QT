# small_size 优化版 v2 — 参数扫描最优 (Sharpe最高)
# ============================================================
# Sweep 结果: AR=48.46%, MDD=18.82%, Sharpe=1.55, Calmar=2.58
# 关键变更: top_k 6→4 (更集中)
# ============================================================

name: "small_size_v2_7y"
description: >
  小规模因子轮动策略 v2。基于 60 组参数扫描选出最优风险调整参数。
  top_k=4 集中持仓, max_price=145, max_issue_size=20000。

data:
  source: "tushare_cb"
  start_date: "2018-01-01"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "small_size"
  params:
    top_k: 4
    rebalance_days: 1
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 100.0  # P0-2修复: 10→100万元, 防极端低流动性标的
    min_days_to_maturity: 30
    min_tradable_candidates: 8  # P0-2: 候选池<8只时跳过调仓
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.05   # R112议题7: CB低流动性小规模策略降至5%
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

risk:
  enabled: true
  max_position_weight: 0.30
  max_drawdown: 0.50

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/small_size_v2_7y"
