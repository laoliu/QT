# 次新小盘复合策略 — 初始配置
# ============================================================
# 策略逻辑:
#   结合次新债（上市时间筛选）× 小规模（issue_size 排序）
#   选出新上市且发行规模最小的 top_k 只可转债
#   兼具次新效应与小盘溢价两个Alpha来源
# ============================================================

name: "new_small"
description: >
  次新小盘复合策略 — 在次新债中精选发行规模最小的标的。
  综合 new_bond 的上市时间筛选与 small_size 的规模排序。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "new_small"
  params:
    top_k: 10
    rebalance_days: 5
    min_age_days: 5
    max_age_days: 90
    max_issue_size: 50000.0       # 万元
    min_issue_size: 3000.0        # 万元
    max_price: 130.0
    min_turnover: 30.0
    exclude_st: true
    stop_loss_pct: 0.15
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/new_small"
