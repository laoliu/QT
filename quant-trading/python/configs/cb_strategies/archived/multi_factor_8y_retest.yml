# 可转债多因子策略 — 8年回测（复现原始配置）
# 用于对比 P0-3 修复前后的影响
name: "multi_factor_8y_retest"
description: "多因子融合策略 — 复现原始 multi_factor_8y 配置"

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-20"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "multi_factor"
  params:
    top_k: 20
    rebalance_days: 3
    price_weight: 0.25
    premium_weight: 0.20
    cb_value_weight: 0.00      # R94: 与 delta 共线，关闭
    size_weight: 0.25           # R94: 独立维度，提权
    max_price: 130.0
    max_premium: 40.0
    min_turnover: 50.0
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.15
    buffer_k: 0
    lot_size: 10

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/multi_factor_8y_retest"

report:
  benchmark: "000300.SH"
