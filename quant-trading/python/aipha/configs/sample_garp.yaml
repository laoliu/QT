# GARP 选股策略回测配置 — Growth At Reasonable Price

name: garp_backtest

data:
  source: akshare
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: qfq

universe:
  policy: default
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 120
  base_index: CSI500

strategy:
  name: garp_select
  params: {}

cost:
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_rate: 0.0005
  slippage_bps: 10.0
  slippage_model: fixed

risk:
  enabled: true
  max_position_weight: 0.05
  max_drawdown: 0.20

initial_capital: 1000000
output_dir: output/garp
