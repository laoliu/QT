name: quality_growth_smallcap_12y
description: A 股质量成长策略-小盘增强版 (12年, 目标年化35%+)
data:
  source: tushare
  start_date: '2014-01-01'
  end_date: '2025-12-31'
  frequency: 1d
  adjust: qfq
  cache_dir: data/cache/tushare
strategy:
  name: quality_growth
  params:
    top_k: 20
    rebalance_days: 10
    buffer_k: 6
    max_single_pct: 0.08
    inverse_vol_weighting: true
    max_industry_pct: 0.25
    min_roe: 8.0
    min_revenue_growth: 5.0
    min_profit_growth: 5.0
    max_pe: 60.0
    max_debt_to_assets: 60.0
    min_price: 5.0
    max_price: 150.0
    min_mv: 200000.0
    max_mv: 2000000.0
    min_turnover: 1000.0
    min_listed_days: 120
    stop_loss_pct: 0.12
    trailing_stop_pct: 0.18
    weight_earnings_growth: 0.35
    weight_momentum: 0.25
    weight_quality: 0.15
    weight_volatility: 0.15
    weight_valuation_pct: 0.1
    momentum_lookback: 20
    momentum_skip_recent: 3
    momentum_multi_period: true
    volatility_lookback: 60
fill_model:
  name: next_bar_open
cost:
  commission_rate: 8.54e-05  # §13.1 MarketRulesCNEquity 万2.5
  commission_min: 5.0
  stamp_tax_rate: 0.0005
  stamp_tax_auto_schedule: true
  transfer_fee_rate: 1.0e-05
  slippage_model: linear_impact
  slippage_base_bps: 3.0
  slippage_impact_coeff: 30.0
  slippage_max_bps: 50.0
  slippage_fallback_bps: 8.0
risk:
  enabled: true
  max_position_weight: 0.08
  max_drawdown: 0.6
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5
  enable_audit_log: true
universe:
  policy: default
  exclude_st: true
  exclude_suspended: true
  base_index: 000852.SH
initial_capital: 1000000.0
lot_size: 100
t_plus_n: 1
random_seed: 42
output_dir: output/quality_growth_smallcap_12y
