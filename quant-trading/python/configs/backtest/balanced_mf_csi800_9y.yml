cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05
data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare
fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.1
    lot_size: 100
    opening_volume_fraction: 0.1
frequency:
  data_frequency: 1d
  matching_resolution: 1d
initial_capital: 1000000
market:
  instruments:
    asset_type: stock
    boards:
    - A
    index: 000906.SH
  region: CN
report:
  benchmark: 000300.SH
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  - win_rate
  - positions_count_distribution
  - cost_impact
  output_dir: reports/balanced_mf_csi800
  universe_summary: true
risk_constraints:
  max_drawdown_pct: 0.5
  max_sector_pct: 0.3
  max_single_position_pct: 0.06
  market_regime_enabled: false
  stop_loss_pct: 1.0
  trailing_stop_pct: 1.0
  circuit_breaker_enabled: false
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5
run:
  start_date: '2016-01-04'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai
slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 40.0
  fallback_bps: 10.0
  max_bps: 80.0
strategy:
  name: balanced_multifactor
  parameters:
    top_k: 30
    rebalance_days: 40
    min_mv: 300000.0
    max_mv: 50000000.0
    min_price: 3.0
    max_price: 800.0
    min_turnover: 1000.0
    min_listed_days: 120
    stop_loss_pct: 0.25
    trailing_stop_pct: 0.25
    buffer_k: 20
    cash_reserve_pct: 0.03
    max_single_pct: 0.06
    inverse_vol_weighting: true
    weight_value: 0.25
    weight_quality: 0.25
    weight_momentum: 0.25
    weight_volatility: 0.25
    weight_dividend: 0.0
    weight_earnings_growth: 0.0
    momentum_lookback: 60
    momentum_skip_recent: 5
    momentum_multi_period: true
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe
    regime_adaptive: false
trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1
universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  base_index: 000906.SH
  manual_exclude_list: configs/universe/exclude_list.yml
