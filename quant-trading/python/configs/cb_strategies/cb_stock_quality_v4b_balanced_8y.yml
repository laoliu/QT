# CBStockQuality v4b — 均衡调整版
# ============================================================
# 基于 v3 (AR=27.6%, SR=1.32) 的温和权重优化。
#
# v3→v4b 变更理据:
#   1. issue_size 0.25→0.10: 与策略文档默认值对齐，保留弱信号
#   2. stock_roe 0.20→0.25: 适度提升正股质量权重
#   3. stock_ep 0.15→0.20: 适度提升价值因子权重
#   4. stock_vol 0.10→0.15: 提升期权价值因子（期权数学支撑好）
#   5. CB本体不变: price(0.18) + premium(0.12) = 0.30
#
# 调整后因子矩阵:
#   Layer 1 (CB本体): price(0.18) + premium(0.12) = 0.30
#   Layer 2 (正股质量): stock_roe(0.25) + stock_ep(0.20) + stock_vol(0.15) = 0.60
#   Structural: issue_size(0.10)
#   → 总权重 = 1.00
#
# 预期效果:
#   - 温和改善 Post-2022（小幅降低小盘依赖）
#   - 基本面占 60%（vs v3 的 45%），但保持 size 因子的 alpha 捕获
#   - 降级风险中等: 正股桥接失败影响 45% 权重（vs v4a 的 55%）
# ============================================================

name: "cb_stock_quality_v4b_balanced_8y"
description: >
  正股质量加强型CB策略 v4b（均衡调整版）。
  5+1 因子: price(0.18) + premium(0.12) + stock_roe(0.25) + stock_ep(0.20)
  + stock_vol(0.15) + issue_size(0.10)。
  分散持仓(top_k=10) + 小盘筛选(sz≤20000) + 日频调仓。
  v3→v4b: issue_size 0.25→0.10, ROE +5%, EP +5%, Vol +5%。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality"
  params:
    # --- 结构参数（与v3一致） ---
    top_k: 10
    rebalance_days: 1
    # --- 过滤参数（与v3一致） ---
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 60.0
    # --- Layer 1 权重 (CB 本体，合计 0.30, 不变) ---
    weight_price: 0.18
    weight_premium: 0.12
    # --- Layer 2 权重 (正股质量，合计 0.60, 提升) ---
    weight_stock_roe: 0.25
    weight_stock_ep: 0.20
    weight_stock_vol: 0.15
    # --- Structural (规模因子，0.25→0.10, 对齐文档默认值) ---
    weight_issue_size: 0.10
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true
    default_roe: 0.0
    default_ep: 0.0

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.05   # R112议题7: CB策略降至5%
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0  # 固定5bps (与 runtime config 一致, R115修正)
  # slippage_model/slippage_params 已移除: runtime 实际使用固定滑点模型
  # 原 linear_impact (impact_coeff=50, max_bps=40) 从未被引擎加载

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42

output_dir: "output/cb_stock_quality_v4b_balanced_8y"
