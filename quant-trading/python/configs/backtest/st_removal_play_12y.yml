# G5-3 摘帽博弈 (ST Removal Play) 12 年回测
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000905.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: st_removal_play
  parameters:
    top_k: 10
    rebalance_days: 15
    min_price: 3.0
    max_price: 80.0
    min_turnover: 300.0
    min_listed_days: 500
    stop_loss_pct: 0.25
    trailing_stop_pct: 0.20
    buffer_k: 3
    max_single_pct: 0.12
    min_mv: 100_000.0
    max_mv: 1_000_000.0
    max_industry_pct: 0.30

    weight_earnings: 0.40
    weight_fscore: 0.25
    weight_value: 0.20
    weight_size: 0.15
    min_fscore: 5.0
    max_pe: 80.0
