# 均衡多因子策略 — HS300 成分内 12年回测
# Direction B: Quality + Value + Momentum + LowVol 四因子等权
# 限定沪深300成分股，对比全市场版本

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
    opening_volume_fraction: 0.10  # 开盘集合竞价仅占全天成交量~10%

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 000300.SH
  region: CN

report:
  benchmark: 000300.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar, turnover, win_rate,
            positions_count_distribution, cost_impact]
  output_dir: reports/balanced_mf_hs300
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.50
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5
  max_sector_pct: 0.30
  max_single_position_pct: 0.06
  market_regime_enabled: false
  stop_loss_pct: 0.15
  trailing_stop_pct: 0.10
  circuit_breaker_enabled: true

run:
  start_date: '2014-01-02'
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact          # 非线性冲击: bps = base + coeff × participation
  base_bps: 3.0                  # 基础滑点 3 bps（HS300 流动性好）
  impact_coeff: 30.0             # 冲击系数（大盘股较低）
  fallback_bps: 8.0              # 无成交量数据时回退
  max_bps: 50.0                  # 滑点上限

strategy:
  name: balanced_multifactor
  parameters:
    top_k: 30
    rebalance_days: 20
    min_mv: 300000.0
    max_mv: 50000000.0      # HS300都是大盘，上限提高到5000亿
    min_price: 5.0
    max_price: 500.0         # HS300含高价股
    min_turnover: 2000.0     # 大盘流动性充足
    min_listed_days: 120
    stop_loss_pct: 0.15
    trailing_stop_pct: 0.10
    buffer_k: 10
    cash_reserve_pct: 0.03
    max_single_pct: 0.06
    inverse_vol_weighting: true
    weight_value: 0.25
    weight_quality: 0.25
    weight_momentum: 0.25
    weight_volatility: 0.25
    weight_dividend: 0.0
    weight_earnings_growth: 0.0
    momentum_lookback: 60
    momentum_skip_recent: 5
    momentum_multi_period: true
    volatility_lookback: 60
    value_metric: pe_ttm
    quality_metric: roe
    regime_adaptive: false

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000300.SH
  manual_exclude_list: configs/universe/exclude_list.yml
