# 多因子指数增强回测配置
# 目标：在沪深300/中证500基础上获取稳定 Alpha
# 策略：价值(PE)+质量(ROE)+动量(20d)+低波动(60d)+小市值 五因子打分选股

run:
  mode: backtest
  start_date: "2020-01-01"
  end_date: "2025-09-05"
  timezone: "Asia/Shanghai"
  seed: 42

data:
  provider: "tushare_pro"
  cache_dir: data/cache/tushare
  snapshot: "latest"
  region: "CN"
  instruments:
    asset_type: "stock"
    index: "000300.SH"  # 可改为 000905.SH(CSI500), 000852.SH(CSI1000)
    boards:
      - "A"

frequency:
  data_frequency: "1d"
  matching_resolution: "1d"

fill_model:
  name: "next_bar_open"  # 下一根 bar 开盘成交，避免前视偏差
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

universe_policy:
  name: "multifactor_enhance"
  base_index: "000300.SH"
  auto_exclude:
    - "ST"
    - "DELISTING"
    - "SUSPENDED_LONG"
  manual_exclude_list: "configs/universe/exclude_list.yml"

trading_rules:
  t_plus: 1
  allow_short: false
  lot_size: 100

cost_model:
  commission:
    rate: 8.5e-05  # §13.1 A-stock default     # 万一佣金
    min_fee: 5.0
  stamp_tax:
    sell_rate: 0.0005  # 千分之0.5（2023-08-28 起减半）
  transfer_fee:
    rate: 0.00001

slippage_model:
  name: "fixed_bps"
  bps: 5

initial_capital: 1000000

strategy:
  name: "multifactor_enhance"
  parameters:
    top_k: 50
    rebalance_days: 20   # 月度调仓
    benchmark: "000300.SH"

    # 过滤
    min_price: 5.0
    max_price: 200.0
    min_turnover: 1000.0  # 万元
    exclude_st: true
    min_listed_days: 120

    # 风控
    stop_loss_pct: 0.20
    max_single_pct: 0.05  # 单票最多5%
    cash_reserve_pct: 0.05  # 现金缓冲比例（显式声明，避免依赖默认值）

    # 因子权重
    weight_value: 0.25      # 低 PE/PB
    weight_quality: 0.20    # 高 ROE
    weight_momentum: 0.20   # 20d 动量
    weight_volatility: 0.20 # 低波动
    weight_size: 0.15       # 小市值偏好

    # 因子参数
    momentum_lookback: 20
    volatility_lookback: 60
    value_metric: "pe_ttm"  # pe_ttm | pb

    # 交易
    lot_size: 100
    buffer_k: 10

risk_constraints:
  max_single_position_pct: 0.05
  max_sector_pct: 0.25
  max_drawdown_pct: 0.20

report:
  benchmark: "000300.SH"
  metrics:
    - "annual_return"
    - "max_drawdown"
    - "sharpe"
    - "calmar"
    - "turnover"
    - "win_rate"
    - "positions_count_distribution"
    - "cost_impact"
    - "alpha"
    - "beta"
    - "information_ratio"
  universe_summary: true
  output_dir: "reports/multifactor_enhance"

