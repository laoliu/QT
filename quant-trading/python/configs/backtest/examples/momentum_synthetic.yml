# 完整回测配置示例：动量策略 + TuShare真实数据
# 用于验证系统端到端闭环
#
# 用法: python scripts/run_backtest.py --config configs/backtest/examples/momentum_synthetic.yml

name: "momentum_e2e"
description: |
  端到端验证配置（TuShare真实数据）
  - 使用TuShare Pro真实日线行情
  - 验证完整流程: data → strategy → backtest → report
  - 可复现（固定随机种子）

# ============================================================================
# 数据配置（TuShare Pro 真实数据）
# ============================================================================
data:
  source: "tushare"  # 使用TuShare真实数据
  start_date: "2024-01-01"
  end_date: "2024-03-31"  # 3个月
  cache_dir: "data/cache/tushare"
  frequency: "1d"
  symbols:
    - "000001.SZ"  # 平安银行
    - "000002.SZ"  # 万科A
    - "000063.SZ"  # 中兴通讯
    - "000333.SZ"  # 美的集团
    - "000568.SZ"  # 泸州老窖
    - "000725.SZ"  # 京东方A
    - "000858.SZ"  # 五粮液
    - "002415.SZ"  # 海康威视
    - "600000.SH"  # 浦发银行
    - "600036.SH"  # 招商银行
    - "600519.SH"  # 贵州茅台
    - "601318.SH"  # 中国平安

# ============================================================================
# 股票池配置
# ============================================================================
universe:
  policy: "a_share_default"
  exclude_st: true
  exclude_suspended: true
  exclude_limit: true
  min_listing_days: 0  # 合成数据不检查

# ============================================================================
# 策略配置
# ============================================================================
strategy:
  name: "momentum"  # 使用注册表中的 momentum 策略
  params:
    lookback_days: 10  # 10日动量
    top_k: 5  # 持仓5只
    rebalance_days: 5  # 每周调仓

# ============================================================================
# 成本配置
# ============================================================================
cost:
  commission_rate: 8.54e-05  # §13.1 MarketRulesCNEquity 万一佣金
  commission_min: 5.0
  stamp_tax_rate: 0.0005  # 千分之五
  transfer_fee_rate: 0.00001
  slippage_bps: 10.0  # §13.1 MarketRulesCNEquity A股默认10bps

# ============================================================================
# 回测设置
# ============================================================================
initial_capital: 1000000.0
lot_size: 100
t_plus_n: 1
random_seed: 42
output_dir: "output/e2e_verification"
