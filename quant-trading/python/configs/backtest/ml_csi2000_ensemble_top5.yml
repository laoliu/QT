# ============================================================
# CSI2000 ML Top-5 Ensemble — OOS Rank-Average
# ============================================================
# 5 diverse models: 3 horizons (5d/10d/20d), 2 model types
#   1) lgb_20d_r40     — ICIR=1.42, IC=0.19, 20d LGB, top ICIR
#   2) de_10d          — ICIR=1.20, IC=0.17, 10d DoubleEnsemble
#   3) lgb_b3_sizeneutral — ICIR=1.33, IC=0.16, size-neutral LGB
#   4) lgb_fund_t1aligned — ICIR=1.08, IC=0.14, T+1 aligned
#   5) de_5d           — ICIR=1.10, IC=0.15, 5d DoubleEnsemble
# ============================================================

cost_model:
  commission:
    min_fee: 5.0
    rate: 0.0000854
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 0.00001

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
    opening_volume_fraction: 0.1

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 399303.SZ
  region: CN

report:
  benchmark: 399303.SZ
  output_dir: output/ml_csi2000_ensemble_top5
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.30
  max_sector_pct: 0.15
  max_single_position_pct: 0.03
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  circuit_breaker_enabled: false
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2020-01-17'
  end_date: '2025-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: fixed
  bps: 8.0

strategy:
  name: ml_factor
  parameters:
    check_index_member: false
    top_k: 50
    rebalance_days: 10
    buffer_k: 5
    min_price: 3.0
    max_price: 100.0
    min_turnover: 300.0
    min_listed_days: 120
    model_objective: regression
    model_type: lightgbm
    ensemble_method: rank_average
    oos_predictions_paths:
      - models/ml_csi2000_lgb_20d_r40/oos_predictions.parquet
      - models/ml_csi2000_de_10d/oos_predictions.parquet
      - models/ml_csi2000_lgb_b3_sizeneutral/oos_predictions.parquet
      - models/ml_csi2000_lgb_fund_t1aligned/oos_predictions.parquet
      - models/ml_csi2000_de_5d/oos_predictions.parquet
