# ─────────────────────────────────────────────
# G4-2 波动管理价值 (Vol-Managed Value) 12 年回测
# 逻辑：价值选股 + HV 倒数仓位管理
# ─────────────────────────────────────────────
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000300.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: vol_managed_value
  parameters:
    top_k: 30
    rebalance_days: 15
    min_price: 5.0
    max_price: 200.0
    min_turnover: 500.0
    min_listed_days: 250
    stop_loss_pct: 0.15
    trailing_stop_pct: 0.12
    buffer_k: 8
    max_single_pct: 0.05
    min_mv: 500_000.0
    max_industry_pct: 0.20

    weight_ep: 0.30
    weight_bp: 0.20
    weight_quality: 0.25
    weight_turnover: 0.25

    vol_lookback: 20
    target_vol: 0.015
    min_position_scale: 0.30

    max_pe: 50.0
