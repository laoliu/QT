# Compatibility alias for the canonical A-share research pipeline.
# New runs should use configs/research/a_stock_ml.yaml; this file remains
# readable so existing scripts do not silently select an AKShare backtest.
data:
  provider: tushare_pit
  snapshot_dir: data/snapshots
  frequency: 1d
  adjust: qfq

universe:
  base_index: CSI500
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 252

features:
  version: cn_equity_v1
  groups: [value, quality, momentum, volatility, liquidity, technical]

label:
  type: forward_return_rank
  horizon_days: 20
  skip_days: 1

model:
  type: lightgbm_ranker
  objective: lambdarank
  train_years: 3
  test_months: 1
  purge_days: 20

portfolio:
  rebalance: monthly
  top_k: 30
  max_position_weight: 0.05
  max_daily_turnover: 0.30

cost:
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_bps: 15.0

execution:
  mode: paper
