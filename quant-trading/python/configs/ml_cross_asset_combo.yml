# ML 跨资产组合配置 — CSI2000 V2 Ensemble + CSI300 T1A
# ============================================================
# V2 更新: 替换冗余 de_5d (ρ=0.957 vs de_10d) 为中性化+P1 模型
#   新模型 lgb_20d_neutral_p1: ICIR=2.15, avg ρ=0.753 (最低相关)
# 基于 2020-2025 重合期 (1432 交易日) 分析:
#   CSI2000_v2 vs CSI300_t1a: ρ = 0.487
#   年度反相关: 2022 (CSI300 -20% vs CSI2000 +12%)
#                2024 (CSI300 +19% vs CSI2000 -9%)
# ============================================================

combination:
  name: "ml_cross_asset_2leg_v2"
  description: "ML CSI2000 V2 Ensemble (neutralized) + CSI300 T1A"
  rebalance_frequency: "monthly"
  overlap_period: "2020-01-17 ~ 2025-12-15"

# ── 组合成分策略 ──
legs:
  ml_csi2000_ensemble_v2:
    config: "configs/backtest/ml_csi2000_ensemble_v2_neutral.yml"
    output: "output/ml_csi2000_ensemble_v2_neutral"
    metrics:
      ar_pct: 29.6
      mdd_pct: 37.1
      sharpe: 1.15
      calmar: 0.80
      turnover: 10.9

  ml_csi300_t1a:
    config: "configs/backtest/ml_csi300_t1a_low_turnover.yml"
    output: "output/ml_csi300_t1a_low_turnover"
    metrics:
      ar_pct: 19.4
      mdd_pct: 29.2
      sharpe: 1.00
      calmar: 0.66
      turnover: 14.6

# ── 方案对比 ──
plans:
  # 方案 E: 推荐 — V2 最优风险调整
  plan_e_recommended:
    weights: { ml_csi2000_ensemble_v2: 0.60, ml_csi300_t1a: 0.40 }
    metrics:
      ar_pct: 25.3
      vol_pct: 18.8
      sharpe: 1.35
      mdd_pct: 21.4
      calmar: 1.18
      cvar_95_pct: 2.89
      max_recovery_months: 10.2
      monthly_win_rate: 0.67
    yearly: { 2020: 45.0, 2021: 44.0, 2022: -2.0,
              2023: 23.0, 2024: 2.0, 2025: 46.0 }
    gates:
      ar_ge_20pct: true
      mdd_le_30pct: true
      sr_ge_0.8: true
      calmar_ge_0.6: true

  # 方案 D: CSI2000 主导
  plan_d_aggressive:
    weights: { ml_csi2000_ensemble_v2: 0.70, ml_csi300_t1a: 0.30 }
    metrics:
      ar_pct: 26.1
      vol_pct: 19.5
      sharpe: 1.34
      mdd_pct: 25.3
      calmar: 1.03
    yearly: { 2020: 40.0, 2021: 46.0, 2022: 2.0,
              2023: 26.0, 2024: -1.0, 2025: 50.0 }

  # 方案 F: 保守型 — 最低 MDD
  plan_f_conservative:
    weights: { ml_csi2000_ensemble_v2: 0.50, ml_csi300_t1a: 0.50 }
    metrics:
      ar_pct: 24.5
      vol_pct: 18.3
      sharpe: 1.34
      mdd_pct: 21.9
      calmar: 1.12
    yearly: { 2020: 49.0, 2021: 43.0, 2022: -5.0,
              2023: 20.0, 2024: 5.0, 2025: 42.0 }

  # 方案 G: 最优 SR 权重
  plan_g_optimal_sr:
    weights: { ml_csi2000_ensemble_v2: 0.59, ml_csi300_t1a: 0.41 }
    metrics:
      ar_pct: 25.2
      sharpe: 1.35
      mdd_pct: 21.3
      calmar: 1.19


