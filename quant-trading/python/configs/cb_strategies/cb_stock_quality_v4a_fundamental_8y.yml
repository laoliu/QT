# CBStockQuality v4a — 基本面主导版
# ============================================================
# 基于 v3 (AR=27.6%, SR=1.32) 的权重优化实验。
#
# v3→v4a 变更理据:
#   1. issue_size 0.25→0.05: 规模因子 Post-2022 结构性衰退
#      (v3f_wider_size SR从1.32降至0.70)，且v3配置与策略文档
#      默认值(≤0.10)不一致，降至弱信号角色
#   2. stock_roe 0.20→0.30: 提升正股质量权重，ROE IC=4-6%稳定
#   3. stock_ep 0.15→0.25: 提升价值因子权重，覆盖估值修复逻辑
#   4. stock_vol 0.10→0.10: 不变（期权数学理论支撑充分）
#   5. CB本体不变: price(0.18) + premium(0.12) = 0.30
#
# 调整后因子矩阵:
#   Layer 1 (CB本体): price(0.18) + premium(0.12) = 0.30
#   Layer 2 (正股质量): stock_roe(0.30) + stock_ep(0.25) + stock_vol(0.10) = 0.65
#   Structural: issue_size(0.05)
#   → 总权重 = 1.00
#
# 预期效果:
#   - Post-2022 表现应改善（降低了衰退中的小盘因子依赖）
#   - 基本面因子占主导（65%）→ 更依赖正股桥接数据质量
#   - 降级风险增大: 正股桥接失败时 ROE/EP 归零影响 55% 权重
# ============================================================

name: "cb_stock_quality_v4a_fundamental_8y"
description: >
  正股质量加强型CB策略 v4a（基本面主导版）。
  5+1 因子: price(0.18) + premium(0.12) + stock_roe(0.30) + stock_ep(0.25)
  + stock_vol(0.10) + issue_size(0.05)。
  分散持仓(top_k=10) + 小盘筛选(sz≤20000) + 日频调仓。
  v3→v4a: issue_size 0.25→0.05, ROE 0.20→0.30, EP 0.15→0.25。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality"
  params:
    # --- 结构参数（与v3一致） ---
    top_k: 10
    rebalance_days: 1
    # --- 过滤参数（与v3一致） ---
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 60.0
    # --- Layer 1 权重 (CB 本体，合计 0.30, 不变) ---
    weight_price: 0.18
    weight_premium: 0.12
    # --- Layer 2 权重 (正股质量，合计 0.65, 大幅提升) ---
    weight_stock_roe: 0.30
    weight_stock_ep: 0.25
    weight_stock_vol: 0.10
    # --- Structural (规模因子，0.25→0.05 弱化) ---
    weight_issue_size: 0.05
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true
    default_roe: 0.0
    default_ep: 0.0

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42

output_dir: "output/cb_stock_quality_v4a_fundamental_8y"
