name: "small_size_optimized"

description: >

  小规模可转债策略（优化版）�?调整风控参数以匹配集中持仓特征�?
  纯发行规模因子排序，日频调仓�?


# ------ 数据 ------

data:

  source: "tushare_cb"

  start_date: "2018-01-01"

  end_date: "2024-12-31"

  frequency: "1d"

  adjust: "none"

  cache_dir: "data/cache/cb_tushare"



# ------ 策略 ------

strategy:

  name: "small_size"

  params:

    top_k: 5

    rebalance_days: 1

    max_price: 150.0

    max_issue_size: 20000.0       # 万元 (2亿以下的极小规模)

    min_turnover: 10.0

    exclude_st: true

    stop_loss_pct: 0.10  # CB��ծ�ױ���,10%ֹ�������(�޸�F-R3)

    lot_size: 10



# ------ 成交模型 ------

fill_model:

  name: "next_bar_open"

  volume_constraint:

    max_participation_rate: 0.10
    opening_volume_fraction: 0.15

    lot_size: 10



# ------ 成本 (可转�? ------

cost:

  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond

  commission_min: 5
  stamp_tax_rate: 0.0

  transfer_fee_rate: 0.0

  slippage_bps: 5.0               # 保守滑点



# ------ 资金与规�?------

initial_capital: 500000.0

lot_size: 10

t_plus_n: 0



# ------ 风控约束 ------

risk:

  enabled: true

  max_position_weight: 0.25       # k=5 �?20%/�?+ 5% 缓冲

  max_drawdown: 0.50              # 放宽以避免反馈循�?
  enable_audit_log: true



# ------ 实验指纹 ------

random_seed: 42



# ------ 输出 ------

output_dir: "output/small_size_optimized"

