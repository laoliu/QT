# 小规模策�?(参数集成�? �?降低悬崖效应

# ============================================================

# 设计目标:

#   解决 small_size 策略存在的严重参数悬崖效�?

#   - top_k 15�?6: Sharpe 0.88 �?0.023 (骤降 97%)

#   - max_price 120�?32: Sharpe 0.88 �?0.273 (骤降 69%)

#   - max_issue_size 30000�?3000: Sharpe 0.88 �?0.105 (骤降 88%)

#

# 解决方案:

#   用多组近优参数生成多个排名列表，�?倒数排名"加权聚合�?
#   单个参数的极端敏感性被多参数投票平滑�?
#

# 信用风控:

#   默认启用 min_rating="AA"，剔�?AA- 及以下评级转债�?
