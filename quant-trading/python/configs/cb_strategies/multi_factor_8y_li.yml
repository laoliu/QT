# 可转债多因子融合策略 — 8 年回测（linear_impact 滑点）
# ============================================================
# R94 去共线性优化（2026-03-15）：
#   - 移除 YTM（与 price 近单调函数 ρ≈-0.9）和 cb_value（与 delta ρ≈0.8）
#   - 保留 5 个有效独立维度：price / premium / issue_size / delta / rating
#   - 提权真正独立的维度：issue_size, rating
#
# 目标: 在统一成本模型下评估 multi_factor 的真实绩效，
#        与 triple_low_v3 / small_size_v2 等进行公平对比。
# ============================================================

name: "multi_factor_8y_li"
description: >
  多因子融合策略 — R94 去共线性优化版。
  五因子排名融合（price/premium/size/delta/rating），
  移除与已有因子高度共线的 cb_value 和 YTM。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "multi_factor"
  params:
    top_k: 20
    rebalance_days: 3
    price_weight: 0.25
    premium_weight: 0.20
    cb_value_weight: 0.00      # R94: 与 delta 共线，关闭
    size_weight: 0.25           # R94: 独立维度，提权
    delta_weight: 0.10
    rating_weight: 0.20         # R94: 独立维度，提权
    ytm_weight: 0.00            # R94: 与 price 共线，关闭
    max_price: 130.0
    max_premium: 40.0
    min_turnover: 50.0
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.15
    buffer_k: 0
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债，linear_impact) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/multi_factor_8y_li"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
