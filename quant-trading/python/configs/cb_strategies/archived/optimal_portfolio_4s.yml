# 最优 4 策略组合 — 基于 WF 验证 + 相关性优化
# ============================================================
# 组合: triple_low + new_small + small_size_enh + cb_ultra_noage
# 等权分配 (各 25%)
#
# 组合指标 (2017-01 ~ 2024-12, 等权回测):
#   年化收益: 24.36%  |  最大回撤: 11.83%
#   Sharpe:   1.975   |  Calmar:   2.059
#   平均相关: 0.424
#
# WF OOS 验证结果:
#   triple_low:      OOS Sharpe 2.22, Win 83%
#   new_small:        OOS Sharpe 1.05, Win 67% (高绝对收益)
#   small_size_enh:   OOS Sharpe 1.40, Win 67%
#   cb_ultra_noage:   OOS Sharpe 1.28, Win 100%
#
# 策略因子正交性:
#   triple_low  ↔  new_small:       corr 0.442 (低)
#   triple_low  ↔  cb_ultra_noage:  corr 0.296 (很低)
#   new_small   ↔  cb_ultra_noage:  corr 0.347 (低)
#   small_size_enh ↔ cb_ultra_noage: corr 0.442 (低)
# ============================================================

name: "optimal_portfolio_4s"
description: >
  最优 4 策略等权组合: triple_low + new_small + small_size_enh + cb_ultra_noage。
  经 WF 验证的低相关策略组合，年化 24%+，回撤 <12%，Sharpe ~2.0。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2017-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 多策略配置 ------
multi_strategy:
  total_capital: 1000000
  lot_size: 10
  t_plus_n: 0
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  slippage_bps: 5.0
  strategies:
    - name: triple_low
      weight: 0.25
      max_drawdown: 0.20
      params:
        top_k: 20
        rebalance_days: 1
        max_price: 130.0
        max_premium: 35.0
        min_turnover: 20.0
        stop_loss_pct: 0.10
        lot_size: 10

    - name: new_small
      weight: 0.25
      max_drawdown: 0.20
      params:
        top_k: 10
        rebalance_days: 5
        max_age_days: 90
        min_age_days: 5
        max_issue_size: 50000.0
        max_price: 130.0
        stop_loss_pct: 0.15
        lot_size: 10

    - name: small_size_enhanced
      weight: 0.25
      max_drawdown: 0.20
      params:
        top_k: 20
        rebalance_days: 1
        max_price: 115.0
        max_issue_size: 30000.0
        min_issue_size: 3000.0
        min_turnover: 50.0
        stop_loss_pct: 0.15
        lot_size: 10

    - name: cb_ultra_noage
      weight: 0.25
      max_drawdown: 0.25
      params:
        top_k: 5
        rebalance_days: 1
        max_price: 200.0
        max_issue_size: 20000.0
        min_issue_size: 2000.0
        stop_loss_pct: 0.50
        lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

# ------ 资金与规则 ------
initial_capital: 1000000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/optimal_portfolio_4s"

# ------ 报告 ------
report:
  benchmark: null
  custom_benchmark: "000832.CSI"

# ============================================================
# 验证结果 (组合优化器 _portfolio_optimizer.py)
# ============================================================
verified_metrics:
  annual_return_pct: 24.36
  max_drawdown_pct: 11.83
  sharpe: 1.975
  calmar: 2.059
  avg_correlation: 0.424
