# A股小盘因子轮动策略回测配置
# 策略：小市值 + 动量 + 低换手 + 低波动 多因子打分选股
# 股票池：全 A 股（排除 ST/退市/创板/次新）
# 频率：日频数据 + NBO 成交

run:
  mode: backtest
  start_date: "2020-01-01"
  end_date: "2025-09-05"
  timezone: "Asia/Shanghai"
  seed: 42

data:
  provider: "tushare_pro"
  cache_dir: data/cache/tushare
  snapshot: "latest"
  equity_data:
    stock_basic: true
    daily_basic: true     # 必须：提供 circ_mv, turnover_rate, pe_ttm, pb

market:
  region: "CN"
  instruments:
    asset_type: "stock"
    boards:
      - "A"

frequency:
  data_frequency: "1d"
  matching_resolution: "1d"

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

universe_policy:
  name: "smallcap_rotation"
  auto_exclude:
    - "ST"
    - "DELISTING"
    - "SUSPENDED_LONG"
  manual_exclude_list: "configs/universe/exclude_list.yml"
  filters:
    min_listed_days: 60     # 排除次新股
    min_circ_mv: 100000     # 最小 10 亿元（万元）
    max_circ_mv: 2000000    # 最大 200 亿元（万元）
    min_price: 3.0
    max_price: 50.0
    min_turnover: 500       # 最小日成交额 500 万

trading_rules:
  t_plus: 1
  allow_short: false
  lot_size: 100

cost_model:
  commission:
    rate: 8.5e-05  # §13.1 A-stock default    # 万一佣金
    min_fee: 5.0
  stamp_tax:
    sell_rate: 0.0005   # 2023-08-28 起千分之 0.5
  transfer_fee:
    rate: 0.00001

slippage_model:
  name: linear_impact
  base_bps: 3.0
  impact_coeff: 50.0
  fallback_bps: 10.0
  max_bps: 100.0

initial_capital: 1000000

strategy:
  name: smallcap_rotation
  # ---------- 仅暴露核心可调参数，其余使用 dataclass 默认值 ----------
  # 已移除重复/可派生参数：benchmark(已在 report 块), exclude_st(由 universe_policy 管理),
  # lot_size(由 trading_rules 管理), max_single_pct(由 risk_constraints 管理),
  # min_price/max_price/min_turnover/min_listed_days/momentum_lookback/volatility_lookback
  # /cash_reserve_pct/buffer_k → 基类默认值足够。
  parameters:
    top_k: 30
    rebalance_days: 15
    min_mv: 100000.0
    max_mv: 2000000.0
    stop_loss_pct: 0.15
    momentum_invert: false
    regime_adaptive: false
    # ---------- 因子权重（总和应为 1.0） ----------
    weight_small_cap: 0.30
    weight_momentum: 0.15
    weight_turnover: 0.10
    weight_volatility: 0.15
    weight_quality: 0.15
    weight_value: 0.15
    # ---------- 以下参数使用 dataclass 默认值（无需显式指定） ----------
    # buffer_k: 8, cash_reserve_pct: 0.05, min_price: 3.0, max_price: 50.0
    # min_turnover: 500, min_listed_days: 60, momentum_lookback: 20, volatility_lookback: 20

risk_constraints:
  max_single_position_pct: 0.05   # 单票最多 5%（30 只等权 ≈ 3.3%）
  max_drawdown_pct: 0.20

report:
  benchmark: "000852.SH"   # 对标中证1000（小盘代理）
  metrics:
    - "annual_return"
    - "max_drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "turnover"
    - "win_rate"
    - "positions_count_distribution"
    - "cost_impact"
  universe_summary: true
  output_dir: "reports/smallcap_rotation"

