# DoubleLow+ v5 — 滑点压力测试 (impact_coeff 2x)
# ============================================================
# 原则C验证: impact_coeff 翻倍后 Sharpe 是否仍 > 1.0
# 基准: impact_coeff=50 → 测试: impact_coeff=100
# ============================================================

name: "double_low_plus_v5_slip2x"
description: "双低增强策略 v5 — 滑点压力测试 (impact_coeff=100, 2x)"

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "double_low_plus"
  params:
    top_k: 6
    rebalance_days: 1
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 500.0
    min_turnover: 10.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.08
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    max_premium: 60.0
    lookback: 20
    bb_k: 2.0
    weight_price: 0.10
    weight_premium: 0.10
    weight_size: 0.35
    weight_age: 0.05
    weight_mean_reversion: 0.25
    weight_rating: 0.15
    min_candidates: 3

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 100.0    # 2x (原值 50.0)
    fallback_bps: 8.0
    max_bps: 80.0          # 同比例调大上限

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/double_low_plus_v5_slip2x"
