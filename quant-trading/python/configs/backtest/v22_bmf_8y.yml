# v22_bmf 6因子聚焦轮动策略 — 8年事件驱动回测
# 中盘(5-150亿) 6因子: Size(0.25) Momentum(0.25) EP(0.15) Growth(0.15) ROE(0.10) LowVol(0.10)
# 与 v19_hgro (微盘2-30亿) 差异化互补
# 2018-01-02 ~ 2025-12-31, 20只, 20日调仓, 无回撤择时

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05       # 万0.85 (§13.1 A-stock default)
  stamp_tax:
    sell_rate: 0.0005    # 万5 (时变印花税自动)
  transfer_fee:
    rate: 1.0e-05        # 万0.1

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards:
    - A
  region: CN

report:
  benchmark: 000905.SH   # 中证500
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  output_dir: output/v22_bmf_8y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.40
  max_sector_pct: 0.20    # 单行业20%
  max_single_position_pct: 0.05

run:
  end_date: '2025-12-31'
  mode: backtest
  seed: 42
  start_date: '2018-01-02'
  timezone: Asia/Shanghai

slippage_model:
  name: fixed_bps
  bps: 20.0               # 保守: 20bps

strategy:
  name: v22_bmf
  parameters:
    top_k: 20
    rebalance_days: 20
    buffer_k: 8
    min_mv: 50000.0        # 5亿 (万元)
    max_mv: 1500000.0      # 150亿 (万元)
    min_price: 3.0
    max_price: 200.0
    min_turnover: 500.0
    min_listed_days: 120
    max_industry_pct: 0.20
    max_pb: 8.0
    min_roe: 0.0
    # 6因子权重 (聚焦高alpha因子)
    weight_size: 0.25
    weight_momentum: 0.25
    weight_ep: 0.15
    weight_profit_growth: 0.15
    weight_roe: 0.10
    weight_low_vol: 0.10
    # 动量参数
    momentum_lookback: 240
    momentum_skip_recent: 20
    volatility_lookback: 60
    # 回撤择时关闭
    drawdown_timing_enabled: false
    dd_reduce_threshold: 0.20
    dd_restore_threshold: 0.10
    dd_min_scale: 0.50

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  manual_exclude_list: configs/universe/exclude_list.yml
  # 全市场模式: min_mv/max_mv 在策略层过滤，不需要指数限制
