# 负溢价偏离策略 — 默认配置
# ============================================================
# 策略逻辑: 买入溢价率为负 (转债价格 < 转股价值) 的转债，等待折价修复
# 非标准轮动 — 仅买入新机会，已持仓在溢价回归时卖出
# 空仓时不强制买入
# ============================================================

name: "negative_premium"
description: >
  负溢价偏离策略 — 买入溢价率为负的转债 (转债价格 < 转股价值)，等待折价修复。
  仅买入新机会，已持仓在溢价回归到 exit_threshold 时卖出。空仓时不强制买入。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "negative_premium"
  params:
    top_k: 10
    rebalance_days: 3
    entry_threshold: -2.0          # 入场阈值: 溢价率 < -2%
    exit_threshold: 0.0            # 出场阈值: 溢价率回归到 0%
    max_price: 200.0               # 负溢价转债价格可能较高
    min_turnover: 50.0
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/negative_premium"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
