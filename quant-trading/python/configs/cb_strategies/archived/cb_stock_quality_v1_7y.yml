# CBStockQuality v1 — 正股质量增强可转债策略
# ============================================================
# 首次引入正股基本面因子（ROE + EP + Vol），打破 CB 策略仅依赖
# CB 本体数据的单一因子模式。
#
# 3 层因子架构：
#   Layer 1 — CB 本体：price(0.25) + premium(0.20)
#   Layer 2 — 正股传导：stock_ROE(0.20) + stock_EP(0.15) + stock_vol(0.10)
#   Weak — issue_size(0.10)
#
# 关键差异（vs 现有策略）：
#   - max_issue_size = inf（不做硬性规模过滤！）
#   - max_price = 150（更宽松，不依赖小票效应）
#   - 正股 ROE + EP 通过 CBStockBridge 获取（PIT 合规）
# ============================================================

name: "cb_stock_quality_v1_7y"
description: >
  正股质量增强可转债策略 v1。
  5+1 因子：price + premium + stock_ROE + stock_EP + stock_vol + issue_size(弱)。
  首次引入正股基本面，不依赖小规模效应。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_stock_quality"
  params:
    top_k: 15
    rebalance_days: 5
    max_price: 150.0
    max_issue_size: .inf              # 不做硬性规模过滤
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.25
    lot_size: 10
    # --- 次新过滤 ---
    use_age_filter: true
    min_age_days: 3
    # --- 溢价率过滤 ---
    max_premium: 80.0
    # --- 5+1 因子权重 ---
    weight_price: 0.25
    weight_premium: 0.20
    weight_stock_roe: 0.20
    weight_stock_ep: 0.15
    weight_stock_vol: 0.10
    weight_issue_size: 0.10           # 弱因子 ≤10%
    # --- 正股数据参数 ---
    vol_lookback: 60
    use_stock_bridge: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.12
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/cb_stock_quality_v1_7y"
