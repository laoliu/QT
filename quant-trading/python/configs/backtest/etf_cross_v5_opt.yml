# ETF V5-opt — Phase 1+2 扫描最优配置 (O3 优化)
# 来自 sweep_etf_v5_factors + sweep_etf_v5_structure
# Phase 1: 因子权重 momentum=0.50, vol=0.10 → AR 12.84%→13.82%
# Phase 2: 结构参数 top_k=3, rebalance=10, trend_ma=0 → 基线最优
# WF(5-fold, 504d/252d): OOS SR=0.30, 3/5盈利 — 单独不达标
# 组合定位: 15%权重分散化组件, 不承担独立alpha

cost_model:
  commission: {min_fee: 5.0, rate: 0.00005}
  stamp_tax: {sell_rate: 0.0}
  transfer_fee: {rate: 0.0}

data:
  provider: tushare_etf
  cache_dir: data/cache/tushare
  adjust: qfq
  max_missing_rate: 0.30
  symbols:
    - 510300.SH
    - 510500.SH
    - 159915.SZ
    - 512100.SH
    - 510050.SH
    - 510880.SH
    - 512010.SH
    - 512690.SH
    - 512660.SH
    - 513100.SH
    - 159920.SZ
    - 518880.SH
    - 511010.SH
    - 513500.SH
    - 512890.SH
    - 513050.SH
    - 511130.SH
    - 511020.SH

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.02
    lot_size: 100
    opening_volume_fraction: 0.10

initial_capital: 1000000

report:
  benchmark: 510300.SH
  output_dir: output/etf_cross_v5_opt

run:
  start_date: '2015-01-05'
  end_date: '2025-12-31'
  seed: 42

slippage_model: {name: fixed, bps: 1.0}

strategy:
  name: etf_rotation
  parameters:
    top_k: 3
    rebalance_days: 10
    weight_momentum: 0.50
    weight_volatility: 0.10
    weight_reversion: 0.00
    weight_volume: 0.00
    momentum_lookback: 20
    volatility_lookback: 20
    reversion_lookback: 5
    trend_ma_period: 0
    stop_loss_pct: 0.0
    trailing_stop_pct: 0.0
    cash_reserve_pct: 0.02
    max_single_pct: 0.50
    lot_size: 100
    buffer_k: 1
    inverse_vol_weighting: true

trading_rules: {t_plus: 1, lot_size: 100}
risk_constraints:
  enabled: true
  max_position_weight: 0.60
  max_drawdown: 0.50
  drawdown_peak_reset_days: 30
  enable_audit_log: true
