# 多因子策略回测配置
# 目标：验证多因子组合在 HS300 成分股上的有效性
# 策略：综合动量、估值、质量、波动率因子，等权或优化权重

run:
  mode: backtest
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  timezone: "Asia/Shanghai"
  seed: 42

data:
  provider: "tushare_pro"
  cache_dir: data/cache/tushare
  snapshot: "latest"
  region: "CN"
  instruments:
    asset_type: "stock"
    index: "000300.SH"  # 沪深300成分股
    boards:
      - "A"

frequency:
  data_frequency: "1d"  # 日频策略
  matching_resolution: "1d"

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100

universe_policy:
  name: "hs300_multifactor"
  base_index: "000300.SH"
  auto_exclude:
    - "ST"
    - "DELISTING"
    - "SUSPENDED_LONG"
  manual_exclude_list: "configs/universe/exclude_list.yml"
  suspended_long:
    lookback_days: 20
    suspended_ratio_threshold: 0.8

trading_rules:
  t_plus: 1
  allow_short: false
  lot_size: 100

cost_model:
  commission:
    rate: 8.5e-05  # §13.1 A-stock default  # 万一佣金
    min_fee: 5.0
  stamp_tax:
    sell_rate: 0.0005  # 2023-08-28 起印花税减半：千分之一 → 千分之0.5
  transfer_fee:
    rate: 0.00001

slippage_model:
  name: "fixed_bps"
  bps: 5

initial_capital: 1000000

strategy:
  name: "multifactor_enhance"
  type: "factor"
  parameters:
    factors:
      momentum:
        enabled: true
        lookback: 20
        weight: 0.25
      value:
        enabled: true
        metric: "pe_ttm"  # 市盈率（TTM）
        weight: 0.25
        direction: "low"  # 低 PE 好
      quality:
        enabled: true
        metric: "roe"  # ROE
        weight: 0.25
        direction: "high"  # 高 ROE 好
      volatility:
        enabled: true
        lookback: 60
        weight: 0.25
        direction: "low"  # 低波动好
    composite_method: "zscore_weighted"  # Z-score 加权
    top_n: 30            # 持有 top N 只股票
    weight_method: "risk_parity"  # 风险平价组合
    rebalance_freq: "monthly"  # 月度调仓

risk_constraints:
  max_single_position_pct: 0.08  # 单票最大 8%
  max_sector_pct: 0.25           # 单行业最大 25%
  max_drawdown_pct: 0.15         # 最大回撤 15%
  daily_loss_limit_pct: 0.03     # 日亏损限制 3%

report:
  benchmark: "000300.SH"  # 对比沪深300
  metrics:
    - "annual_return"
    - "max_drawdown"
    - "sharpe"
    - "calmar"
    - "sortino"
    - "turnover"
    - "win_rate"
    - "positions_count_distribution"
    - "cost_impact"
    - "alpha"
    - "beta"
    - "information_ratio"
    - "factor_returns"  # 因子收益归因
    - "sector_exposure"  # 行业暴露分析
  universe_summary: true
  output_dir: "reports/multifactor_hs300"
