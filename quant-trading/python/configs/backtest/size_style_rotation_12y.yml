# G6-2 大小盘轮动 (Size Style Rotation) 12 年回测
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000905.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: size_style_rotation
  parameters:
    top_k: 30
    rebalance_days: 20
    min_price: 3.0
    max_price: 200.0
    min_turnover: 500.0
    min_listed_days: 120
    stop_loss_pct: 0.18
    trailing_stop_pct: 0.15
    buffer_k: 8
    max_single_pct: 0.05
    min_mv: 100_000.0
    max_industry_pct: 0.20

    large_weight_value: 0.40
    large_weight_quality: 0.35
    large_weight_vol: 0.25
    large_min_mv: 1_000_000.0
    small_weight_size: 0.40
    small_weight_momentum: 0.35
    small_weight_growth: 0.25
    small_max_mv: 1_000_000.0
    style_lookback: 60
    max_pe: 80.0
    momentum_lookback: 60
