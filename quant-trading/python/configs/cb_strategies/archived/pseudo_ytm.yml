# 近似到期收益率策略 — 默认配置
# ============================================================
# 策略逻辑: 买入"到期收益率"最高的低价转债
# 以低于面值买入 = 含免费看涨期权的固收产品
# pseudo_ytm = (face_value - close) / close / years_to_maturity * 100
# ============================================================

name: "pseudo_ytm"
description: >
  近似到期收益率策略 — 买入到期收益率最高的低价转债。
  以低于面值买入等于获得含免费看涨期权的固收产品，同时享有到期保底。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "pseudo_ytm"
  params:
    top_k: 15
    rebalance_days: 10
    max_price: 100.0               # 仅买低于面值的转债
    face_value: 100.0              # 面值
    min_years_to_maturity: 0.5     # 至少半年到期 (避免到期前流动性枯竭)
    min_turnover: 20.0             # 流动性门槛 (万元)
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/pseudo_ytm"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
