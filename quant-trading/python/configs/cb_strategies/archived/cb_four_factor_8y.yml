# CB 多维四因子模型回测配置
# 四因子: 宏观景气 + 正股动量 + 流动性换手率 + 价值低估复合
# 回测区间: 2018-01-02 ~ 2025-12-31 (≥7 年 CB 主评估期)

name: "cb_four_factor_8y"
description: >
  四因子模型 — 宏观景气 + 正股动量 + 流动性换手率 + 价值低估复合评分。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2025-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_four_factor"
  params:
    top_k: 20
    rebalance_days: 5
    max_price: 150.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    stop_loss_pct: 0.25
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_premium: 80.0
    weight_macro: 0.15
    weight_momentum: 0.25
    weight_liquidity: 0.20
    weight_value: 0.40
    momentum_lookback: 20
    volume_lookback: 20
    value_price_w: 0.40
    value_premium_w: 0.40
    value_size_w: 0.20

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/cb_four_factor_8y"

report:
  benchmark: "000300.SH"
