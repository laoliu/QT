# Tiered Portfolio V2 — 1000万级（MDD优化版）
# ====================================================================
# 稳健型: CSI2000(35%) + CB(15%) + ETF(50%)
# P22实测: AR=17.5%  MDD=14.0%  SR=1.369  Calmar=1.248
# 前瞻预期 AR: 14-16%
#
# 对比V1(CSI2000 35%+CB 15%+CSI300 15%+ETF 35%):
#   V1: AR=15.3%, MDD=14.1%, SR=1.298
#   V2: AR=17.5%, MDD=14.0%, SR=1.369 — 去掉CSI300后更优
#
# CSI300 在 P22 段仅 1.0% AR，是组合的拖累项
# ====================================================================

profile_name: "tiered_combo_1000w_v2"
description: >
  MDD优化三组件跨资产组合（1000万级）:
  CSI2000(35%) + CB(15%) + ETF(50%)
  去除CSI300（P22 AR=1.0%，拖累组合）

