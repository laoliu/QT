# ============================================================
# CSI2000 ML V3 Ensemble — Tree-Equal + GRU-Low (5 Tree + 1 GRU)
# ============================================================
# Tree models keep equal weight (1.0 each, same as V2).
# GRU gets low weight (0.2) to add diversification without
# diluting the proven tree-equal signals.
#
# Effective weights (per-symbol normalization):
#   5 tree models:  1.0 each → 19.2% each (96.2% total)
#   gru_v1:         0.2      →  3.8%
#
# Why not ICIR-proportional: ICIR weights [1.87..2.15] break
# the equal tree weighting that V2 relies on, causing 2024
# AR to collapse from -11% to -31%.
# ============================================================

cost_model:
  commission:
    min_fee: 5.0
    rate: 0.0000854
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 0.00001

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
    opening_volume_fraction: 0.1

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
    index: 399303.SZ
  region: CN

report:
  benchmark: 399303.SZ
  output_dir: output/ml_csi2000_ensemble_v3_weighted
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.30
  max_sector_pct: 0.15
  max_single_position_pct: 0.03
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  circuit_breaker_enabled: false
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2020-01-17'
  end_date: '2025-12-31'
  mode: backtest
  seed: 42

slippage_model:
  name: fixed
  bps: 8.0

strategy:
  name: ml_factor
  parameters:
    check_index_member: false
    top_k: 50
    rebalance_days: 10
    buffer_k: 5
    min_price: 3.0
    max_price: 100.0
    min_turnover: 300.0
    min_listed_days: 120
    model_objective: regression
    model_type: lightgbm
    ensemble_method: rank_average
    ensemble_weights:
      ml_csi2000_lgb_20d_r40: 1.0
      ml_csi2000_de_10d: 1.0
      ml_csi2000_lgb_b3_sizeneutral: 1.0
      ml_csi2000_lgb_fund_t1aligned: 1.0
      ml_csi2000_lgb_20d_neutral_p1: 1.0
      ml_csi2000_gru_v1: 0.2
    oos_predictions_paths:
      - models/ml_csi2000_lgb_20d_r40/oos_predictions.parquet
      - models/ml_csi2000_de_10d/oos_predictions.parquet
      - models/ml_csi2000_lgb_b3_sizeneutral/oos_predictions.parquet
      - models/ml_csi2000_lgb_fund_t1aligned/oos_predictions.parquet
      - models/ml_csi2000_lgb_20d_neutral_p1/oos_predictions.parquet
      - models/ml_csi2000_gru_v1/oos_predictions.parquet
