# G5-2 回购信号 (Buyback Signal) 12 年回测
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000300.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: buyback_signal
  parameters:
    top_k: 15
    rebalance_days: 20
    min_price: 5.0
    max_price: 150.0
    min_turnover: 500.0
    min_listed_days: 500
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 5
    max_single_pct: 0.08
    min_mv: 200_000.0
    max_mv: 5_000_000.0
    max_industry_pct: 0.25

    weight_cashflow: 0.30
    weight_value: 0.30
    weight_quality: 0.20
    weight_growth: 0.20
    min_roe: 5.0
    max_pe: 40.0
