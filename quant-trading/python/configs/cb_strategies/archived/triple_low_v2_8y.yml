# 三低策略 v2 — 8年回测 (统一 linear_impact 滑点)
# ============================================================
# 基于 triple_low 策略：低价格 + 低溢价率 + 低转债价值
# 从 triple_low.yml 调整：
#   - start_date 扩展到 2018-01-02 (8年)
#   - end_date 扩展到 2026-03-04 (最新数据)
#   - 统一使用 linear_impact 滑点模型 (与 ss_v2/sq_v4b 一致)
#   - 去掉 low_size_bonus 以降低 Size 暴露
# ============================================================

name: "triple_low_v2_8y"
description: >
  三低策略 v2 — 低价格 + 低溢价率 + 低转债价值的综合评分排名。
  等权归一化三因子评分 + 止损 + 强赎预警。去除小盘加分。

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2026-03-04"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "triple_low"
  params:
    top_k: 20
    rebalance_days: 1
    buffer_k: 0
    max_price: 130.0
    min_price: 0.0
    max_premium: 35.0
    min_issue_size: 0.0
    min_turnover: 20.0
    min_days_to_maturity: 30
    price_weight: 0.33
    premium_weight: 0.33
    cb_value_weight: 0.34
    low_size_threshold: 0.0
    low_size_bonus: 0.0
    stop_loss_pct: 0.10
    force_redeem_threshold: 130.0
    force_redeem_days: 8
    lot_size: 10
    equal_weight: true
    exclude_called: true
    exclude_st: true

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0
random_seed: 42
output_dir: "output/triple_low_v2_8y"

report:
  benchmark: "000300.SH"
