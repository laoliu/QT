# R117 四组件跨资产组合 — 日频模拟盘配置
# ====================================================================
# 方案: R117 heavy_cb (ML2000:30/ML1000:10/CB:40/ETF:20)
# 基于 R116→R117 权重优化评估:
#   - ML_CSI1000 近3年 alpha 严重衰减 (AR 5.1%) → 降权至 10%
#   - CB 低相关性高稳定性 → 增配至 40%
#   - 已通过 Walk-Forward 验证: IS 优化器偏好 CSI1000=50% 证实为过拟合
#   - 分段验证: 新规后(2022.08+) SR=1.074 > R116的1.051
# 组件:
#   ┌──────────────────────┬──────┬──────────┬──────────────┐
#   │ 组件                  │ 权重 │ AR(回测)  │ 调仓频率      │
#   ├──────────────────────┼──────┼──────────┼──────────────┤
#   │ ML CSI2000 Fund       │  30% │ ~19.8%   │ 5 交易日      │
#   │ ML CSI1000 Fund       │  10% │ ~50.0%*  │ 5 交易日      │
#   │ CB Stock Quality      │  40% │ ~21.0%   │ 每交易日      │
#   │ ETF Cross V6 FAA      │  20% │ ~12.0%   │ 10 交易日     │
#   └──────────────────────┴──────┴──────────┴──────────────┘
#   * ML1000 全期 AR 虚高,近3年均 ~5%,已严重衰减
# Combo: AR=22.2%, MDD=-14.6%, SR=1.517, Calmar=1.52
# vs R116: AR -0.8pp, SR +0.034, MDD +1.1pp(改善), Calmar +0.05
# 新规后: AR=15.6%, SR=1.074 > R116的1.051
# Alpha衰减比: 0.789 > R116的0.768 (改善)
# Rolling SR <0 占比: 6.1% < R116的8.2% (改善)
# ====================================================================
# 运行: python scripts/ops/r117_paper_daily.py
# 状态: data/paper_state/r117_combo/
# ====================================================================

profile_name: "r117_combo"
description: >
  R117 四组件跨资产组合 — 双ML引擎+CB(增配)+ETF
  ML1000衰减降权+CB增配方案 (heavy_cb)
  日频 TuShare EOD 批处理模拟盘

initial_capital: 10000000.0  # 1000万

# ── 组合权重 (R117 调整) ──
portfolio_weights:
  ml_csi2000: 0.30   # R116: 0.35 → 0.30 (-5pp)
  ml_csi1000: 0.10   # R116: 0.15 → 0.10 (-5pp, 衰减降权)
  cb: 0.40            # R116: 0.25 → 0.40 (+15pp, 低相关增配)
  etf: 0.20           # R116: 0.25 → 0.20 (-5pp)

# ── MDD 梯度减仓 overlay (可选, 启用后 Calmar 1.52→1.62) ──
mdd_gradient:
  enabled: false  # 谨慎模式下启用
  levels:
    - [0.05, 0.80]   # DD≥5% → 仓位×0.80
    - [0.10, 0.60]   # DD≥10% → 仓位×0.60
    - [0.15, 0.40]   # DD≥15% → 仓位×0.40
    - [0.20, 0.25]   # DD≥20% → 仓位×0.25
    - [0.25, 0.10]   # DD≥25% → 仓位×0.10

# ── ML CSI2000 Fund 配置 ──
ml_csi2000:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi2000_lgb_fund"
  universe: "csi2000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── CB Stock Quality 配置 (增配至40%) ──
cb:
  asset_type: "convertible_bond"
  top_k: 10
  rebalance_freq: "daily"
  max_price: 145.0
  max_issue_size: 20000.0
  min_turnover: 20.0
  max_premium: 60.0
  min_age_days: 3
  min_days_to_maturity: 30
  factor_weights:
    price: 0.18
    premium: 0.12
    stock_roe: 0.25
    stock_ep: 0.20
    stock_vol: 0.15
    issue_size: 0.10
  lot_size: 10
  commission_rate: 0.0000854
  commission_min: 5.0
  slippage_bps: 5.0

# ── ETF Cross V6 FAA 配置 ──
etf:
  asset_type: "etf"
  top_k: 3
  rebalance_freq: "every_10d"
  symbols:
    - "510300.SH"   # 沪深300
    - "510500.SH"   # 中证500
    - "159915.SZ"   # 创业板
    - "512100.SH"   # 中证1000
    - "510050.SH"   # 上证50
    - "510880.SH"   # 红利
    - "512010.SH"   # 医药
    - "512690.SH"   # 酒
    - "512660.SH"   # 军工
    - "513100.SH"   # 纳指
    - "159920.SZ"   # 恒生
    - "518880.SH"   # 黄金
    - "511010.SH"   # 国债

# ── 组合健康监控配置 ──
monitoring:
  risk_contribution:
    ml_csi2000_max: 0.50
    ml_csi2000_warn: 0.45
    check_frequency: weekly
  alpha_decay:
    rolling_sr_window: 252
    sr_threshold: 0.0
    max_consecutive_months: 6
    check_frequency: monthly
  drawdown:
    warn_level: -0.15     # R117: 收紧至 15% (R116: 20%)
    halt_level: -0.20     # R117: 收紧至 20% (R116: 25%)
  pbo_review:
    max_pbo: 0.50
    min_decay_ratio: 0.25
    check_frequency: quarterly# ── ML CSI1000 Fund 配置 (降权至10%) ──
ml_csi1000:
  asset_type: "a_stock"
  legacy_ml_compat: true  # legacy Paper model; migrate to canonical PIT snapshot
  model_dir: "models/ml_csi1000_lgb_fund"
  universe: "csi1000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0
