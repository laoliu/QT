name: "cb_comprehensive_c1_7y"
description: >
  CBComprehensive 12因子增强版（C1）。在10因子基础上加入：
  (1) 溢价率历史百分位（ValuationPercentile）�?当前溢价率处于历史低�?�?信号�?
  (2) 回售接近度（PutbackProximity via cb_value）�?正股跌接近回售触�?�?有下行保�?

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "cb_comprehensive"
  params:
    top_k: 5
    rebalance_days: 1
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 500.0
    min_turnover: 10.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    # 次新过滤
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    # 溢价率过�?
    max_premium: 60.0
    # 均值回�?
    lookback: 20
    bb_k: 2.0
    # 动量
    momentum_lookback: 10
    # 10因子权重 �?保持原始权重，通过归一化自动调�?
    weight_price: 0.10
    weight_premium: 0.10
    weight_size: 0.20        # 保持原始�?
    weight_age: 0.03
    weight_mean_reversion: 0.20  # 保持原始值（已验证有效）
    weight_rating: 0.07
    weight_delta: 0.08
    weight_ytm: 0.07
    weight_turnover: 0.05
    weight_momentum: 0.10
    # C1 新因子权重（加法模式：归一化后自动调整所有因子比例）
    weight_premium_percentile: 0.08   # 溢价率历史百分位�?0日回看）
    weight_putback: 0.05              # 回售接近度（cb_value代理�?
    # C1 新因子参�?
    premium_pct_lookback: 40
    putback_trigger_ratio: 0.85
    # 自适应降级
    min_candidates: 3

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.25
  max_drawdown: 0.50
  enable_audit_log: true

output_dir: "output/cb_comprehensive_c1_7y"
random_seed: 42
