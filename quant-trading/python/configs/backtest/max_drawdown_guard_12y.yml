# ─────────────────────────────────────────────
# G4-5 回撤卫士 (Max Drawdown Guard) 12 年回测
# 逻辑：多因子选股 + 组合回撤动态减仓
# ─────────────────────────────────────────────
backtest:
  start_date: "2014-01-02"
  end_date:   "2025-06-01"
  initial_capital: 1_000_000
  benchmark: "000905.SH"

cost_model:
  commission_rate: 8.54e-05  # 13.1 MarketRulesCNEquity
  min_commission: 5.0
  stamp_tax_rate: 0.0005  # 13.1 MarketRulesCNEquity (2023-08-28+; auto_schedule handles pre-2023)
  transfer_fee_rate: 1.0e-05  # §13.1 MarketRulesCNEquity

fill_model:
  method: next_bar_open

slippage:
  model: linear_impact
  base_bps: 5
  impact_coeff: 0.1

strategy:
  name: max_drawdown_guard
  parameters:
    top_k: 30
    rebalance_days: 10
    min_price: 3.0
    max_price: 200.0
    min_turnover: 500.0
    min_listed_days: 120
    stop_loss_pct: 0.20
    trailing_stop_pct: 0.15
    buffer_k: 8
    max_single_pct: 0.05
    min_mv: 300_000.0
    max_industry_pct: 0.20

    weight_quality: 0.25
    weight_value: 0.25
    weight_momentum: 0.25
    weight_vol: 0.25

    dd_start_threshold: 0.10
    dd_max_threshold: 0.20
    min_position_scale: 0.30

    max_pe: 80.0
    momentum_lookback: 60
