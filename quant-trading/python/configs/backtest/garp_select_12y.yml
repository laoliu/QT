# GARP 选股 — 12年回测 (2014-2025)
# 均衡型策略 G2-3: PEG + ROE + 盈利加速 + 动量

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 0.00002

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.08
    lot_size: 100

slippage_model:
  name: linear_impact
  base_bps: 5
  impact_coeff: 0.1

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards:
    - A
    index: 000905.SH
  region: CN

report:
  benchmark: 000905.SH
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  output_dir: output/garp_select_12y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.40
  drawdown_peak_reset_days: 20
  drawdown_allow_rotation: true
  drawdown_scale_factor_floor: 0.5
  max_sector_pct: 0.20
  max_single_position_pct: 0.05
  stop_loss_pct: 0.15
  trailing_stop_pct: 0.12
  circuit_breaker_enabled: true
  circuit_breaker_drawdown: 0.30
  benchmark_symbol: 000905.SH

run:
  end_date: '2025-12-31'
  mode: backtest
  seed: 42
  start_date: '2014-01-02'
  timezone: Asia/Shanghai

strategy:
  name: garp_select
  parameters:
    top_k: 30
    rebalance_days: 15
    min_price: 3.0
    max_price: 300.0
    min_turnover: 800.0
    min_listed_days: 120
    stop_loss_pct: 0.15
    trailing_stop_pct: 0.12
    buffer_k: 8
    max_single_pct: 0.05
    min_mv: 300000.0
    max_mv: 5000000.0
    max_industry_pct: 0.20
    weight_peg: 0.35
    weight_quality: 0.25
    weight_growth: 0.25
    weight_momentum: 0.15
    max_pe: 60.0
    min_roe: 5.0
    min_profit_growth: 0.0
    momentum_lookback: 60
    momentum_skip_recent: 5
    momentum_multi_period: true

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  base_index: 000905.SH
  manual_exclude_list: configs/universe/exclude_list.yml
  name: garp_select
