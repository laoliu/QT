# CSI1000 重训配置（P2: 含另类因子 + 正则化）
# 基于 ml_factor_csi1000_10y_regularized.yml，增加 alt-factors

cost_model:
  commission: {min_fee: 5.0, rate: 0.000085}
  stamp_tax: {sell_rate: 0.0005}
  transfer_fee: {rate: 1.0e-05}

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.05
    lot_size: 100
    opening_volume_fraction: 0.1

initial_capital: 1000000

market:
  instruments: {asset_type: stock, boards: [A], index: 000852.SH}
  region: CN

report:
  benchmark: 000852.SH
  output_dir: output/ml_csi1000_alt_retrain
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.5
  max_sector_pct: 0.20
  max_single_position_pct: 0.02
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.15
  # R94: MDD 梯度减仓 + 波动率目标
  # R94: death spiral disabled
  position_sizing:
    mdd_gradient:
      enabled: false
    volatility_target:
      enabled: false

run:
  start_date: '2019-01-02'
  end_date: '2026-03-10'
  mode: backtest
  seed: 42

slippage_model:
  name: linear_impact
  base_bps: 8.0
  impact_coeff: 60.0
  fallback_bps: 15.0
  max_bps: 100.0

strategy:
  name: ml_factor
  parameters:
    check_index_member: false
    top_k: 50
    rebalance_days: 5
    model_objective: regression
    model_type: lightgbm
    model_path: models/ml_csi1000_lgb_alt
    oos_predictions_path: models/ml_csi1000_lgb_alt/oos_predictions.parquet
    train_years: 3
    predict_months: 3
    forward_days: 5
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    purge_days: 10
    min_mv: 100000
    max_mv: 30000000

trading_rules: {allow_short: false, lot_size: 100, t_plus: 1}
universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  base_index: 000852.SH

# 训练命令:
# python scripts/train_ml_factor.py --universe csi1000 --model lightgbm \
#   --forward-days 5 --alt-factors --output models/ml_csi1000_lgb_alt
