# DoubleLow+ v7 — 多维降级修复版
# ============================================================
# 变更（相对 v6）：
#   - 新增 fallback_max_issue_size/fallback_max_premium/hold_on_empty
#   - 解决 2022-08 后候选标的枯竭问题（AND 逻辑过滤器组合导致零候选）
#   - weight_size 进一步下调至 0.15（E3 因子归因证实 size > 140% alpha）
# 根因：max_age_days=180 + max_issue_size=20000 + max_premium=60
#        三重 AND 过滤在 2023+ 几乎无候选通过
# 修复：基类多维渐进降级 _filter_with_fallback() + hold_on_empty 防止空仓清仓
# ============================================================

name: "double_low_plus_v7_7y"
description: >
  双低增强策略 v7。修复 2022-08 新规后候选枯竭问题：
  - 新增多维渐进降级（age → issue_size → premium）
  - hold_on_empty=true 防止零候选时强制清仓
  - weight_size 降至 0.15（减少规模因子主导）

data:
  source: "tushare_cb"
  start_date: "2018-01-02"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "double_low_plus"
  params:
    top_k: 10
    rebalance_days: 3
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 500.0
    min_turnover: 10.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10
    use_age_filter: true
    min_age_days: 3
    max_age_days: 180
    fallback_max_age_days: 730
    # --- 多维降级参数 ---
    fallback_max_issue_size: 50000.0   # 降级时放宽至 5 亿
    fallback_max_premium: 100.0        # 降级时放宽至 100%
    hold_on_empty: true                # 零候选时保持现仓
    # --- 因子权重：降低 size 主导 ---
    max_premium: 60.0
    lookback: 20
    bb_k: 2.0
    weight_price: 0.25
    weight_premium: 0.25
    weight_size: 0.15
    weight_age: 0.05
    weight_mean_reversion: 0.20
    weight_rating: 0.10
    min_candidates: 3

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 50.0
    fallback_bps: 8.0
    max_bps: 40.0

initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

risk:
  enabled: true
  max_position_weight: 0.15
  max_drawdown: 0.50
  enable_audit_log: true

random_seed: 42
output_dir: "output/double_low_plus_v7_7y"
