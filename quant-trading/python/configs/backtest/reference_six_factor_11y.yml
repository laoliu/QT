# 参考组合六因子策略 — 全 A 股 11 年回测 (R76 Phase 1 V4)
# ============================================================
# 在五因子(EP+BP+ROE+DY+LV)基础上加入动量因子
# 扁平模式，CSI800, 月频调仓
# ============================================================

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default
  stamp_tax:
    sell_rate: 0.0005
  transfer_fee:
    rate: 1.0e-05

data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare

fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
    opening_volume_fraction: 0.10

frequency:
  data_frequency: 1d
  matching_resolution: 1d

initial_capital: 1000000

market:
  instruments:
    asset_type: stock
    boards: [A]
  region: CN

report:
  benchmark: 000300.SH
  metrics: [annual_return, max_drawdown, sharpe, calmar,
            sortino, turnover, win_rate, cost_impact]
  output_dir: output/ref_6f_momentum_11y
  universe_summary: true

risk_constraints:
  max_drawdown_pct: 0.70
  max_sector_pct: 0.15
  max_single_position_pct: 0.05
  market_regime_enabled: false
  stop_loss_pct: 0.0
  trailing_stop_pct: 0.0
  circuit_breaker_enabled: false

run:
  start_date: "2015-01-05"
  end_date: "2025-12-31"
  mode: backtest
  seed: 42
  timezone: Asia/Shanghai

slippage_model:
  name: linear_impact
  base_bps: 5.0
  impact_coeff: 30.0
  fallback_bps: 10.0
  max_bps: 50.0

strategy:
  name: reference_five_factor
  parameters:
    base_index: "000906.SH"
    top_k: 30
    rebalance_days: 21
    min_mv: 100000.0
    max_mv: 50000000.0
    min_price: 3.0
    max_price: 500.0
    min_turnover: 2000.0
    min_listed_days: 120
    stop_loss_pct: 0.0
    trailing_stop_pct: 0.0
    buffer_k: 10
    cash_reserve_pct: 0.03
    max_single_pct: 0.05
    max_industry_pct: 0.12
    inverse_vol_weighting: false
    # ── 六因子权重 (value+quality偏重) ───────────
    weight_ep: 0.20
    weight_bp: 0.10
    weight_roe: 0.20
    weight_dy: 0.10
    weight_lv: 0.15
    weight_momentum: 0.25
    momentum_multi_period: true
    momentum_skip_recent: 5
    # ── 扁平模式 ─────────────────────────────────
    quadrant_enabled: false
    min_industries: 6
    # ── 因子参数 ──────────────────────────────────
    ep_metric: pe_ttm
    bp_metric: pb
    roe_metric: roe
    dy_metric: dv_ratio
    lv_lookback: 60
    momentum_lookback: 65
    volatility_lookback: 65

trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1

universe_policy:
  auto_exclude: [ST, DELISTING, SUSPENDED_LONG]
  manual_exclude_list: configs/universe/exclude_list.yml
