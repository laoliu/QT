# 可转债多因子融合策略 — 默认配置
# ============================================================
# R94 去共线性优化（2026-03-15）：
#   保留 5 个有效独立维度：price / premium / issue_size / delta / rating
#   移除 cb_value（与 delta 共线）和 YTM（与 price 共线）
# 使用 issue_size (静态字段) 替代 remain_size，消除前视偏差
# ============================================================

name: "multi_factor"
description: >
  可转债多因子融合策略 — 五因子排名加权（R94 去共线性版），
  取综合评分最低的 top_k 只持有。使用 issue_size (静态字段) 消除前视偏差。

# ------ 数据 ------
data:
  source: "tushare_cb"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

# ------ 策略 ------
strategy:
  name: "multi_factor"
  params:
    top_k: 20
    rebalance_days: 3
    price_weight: 0.25             # 价格因子权重
    premium_weight: 0.20           # 溢价率因子权重
    cb_value_weight: 0.00          # R94: 与 delta 共线，关闭
    size_weight: 0.25              # 小规模因子权重（提权）
    max_price: 130.0
    max_premium: 40.0              # 溢价率上限
    min_turnover: 50.0
    min_issue_size: 0.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.15
    buffer_k: 0                    # 缓冲带 (>0 时已持仓在 top_k+buffer_k 内不卖)
    lot_size: 10

# ------ 成交模型 ------
fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

# ------ 成本 (可转债) ------
cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0          # CB 最低买卖价差
    impact_coeff: 50.0     # 参与率每增加1，额外增加50bps
    fallback_bps: 8.0      # 无成交量数据时的回退值
    max_bps: 40.0          # 单笔滑点上限

# ------ 资金与规则 ------
initial_capital: 500000.0
lot_size: 10
t_plus_n: 0

# ------ 实验指纹 ------
random_seed: 42

# ------ 输出 ------
output_dir: "output/multi_factor"

# ------ 报告 ------
report:
  benchmark: "000300.SH"
