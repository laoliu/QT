# A 股多因子增强 — 20 年回测 (2005-2025)
#
# 覆盖 2005.1 ~ 2024.12，含以下关键市场周期：
#   - 2005-2007: 股权分置改革牛市 (998→6124)
#   - 2008: 全球金融危机 (6124→1664)
#   - 2009-2010: 四万亿反弹与消化
#   - 2013-2014: 创业板结构牛
#   - 2015.6: 杠杆牛崩溃 (5178→2850)
#   - 2016-2017: 蓝筹价值回归
#   - 2018: 贸易战单边熊 (3587→2441)
#   - 2019-2021: 核心资产牛市
#   - 2022-2024: 震荡调整与 AI 行情
#
# 费率说明：
#   当前配置使用 2023.8.28 后费率（印花税千0.5），对 2005-2023 期间
#   历史实际印花税（最高时双边千3）有所低估。这是已知的近似。
#   若实现时间分段 FeeModel 后应重新回测。

cost_model:
  commission:
    min_fee: 5.0
    rate: 8.5e-05  # §13.1 A-stock default                    # 万1（当前主流低佣水平）
  stamp_tax:
    sell_rate: 0.0005               # 2023-08-28 起印花税减半（千分之0.5，卖出）
  transfer_fee:
    rate: 1.0e-05                   # 2022-04-29 起统一过户费（万分之0.1）
data:
  provider: tushare_pro
  snapshot: latest
  cache_dir: data/cache/tushare
fill_model:
  name: next_bar_open
  volume_constraint:
    max_participation_rate: 0.10
    lot_size: 100
frequency:
  data_frequency: 1d
  matching_resolution: 1d
initial_capital: 1000000
market:
  instruments:
    asset_type: stock
    boards:
    - A
    index: 000300.SH
  region: CN
report:
  benchmark: 000300.SH
  metrics:
  - annual_return
  - max_drawdown
  - sharpe
  - calmar
  - turnover
  - win_rate
  - positions_count_distribution
  - cost_impact
  - alpha
  - beta
  - information_ratio
  output_dir: reports/multifactor_enhance_20y
  universe_summary: true
risk_constraints:
  max_drawdown_pct: 0.2
  max_sector_pct: 0.25
  max_single_position_pct: 0.05
  market_regime_enabled: true
  benchmark_symbol: 000300.SH
  stop_loss_pct: 0.20
  trailing_stop_pct: 0.12
  momentum_skip_recent: 1
  momentum_multi_period: true
  inverse_vol_weighting: true
  circuit_breaker_enabled: true
  circuit_breaker_drawdown: 0.10
  style_exposure_enabled: true
  style_exposure_limits:
    size: 0.30
    value: 0.30
    momentum: 0.30
run:
  end_date: '2024-12-31'
  mode: backtest
  seed: 42
  start_date: '2005-01-04'
  timezone: Asia/Shanghai
slippage_model:
  bps: 5
  name: fixed_bps
strategy:
  name: multifactor_enhance
  parameters:
    benchmark: 000300.SH
    buffer_k: 10
    exclude_st: true
    lot_size: 100
    max_price: 200.0
    max_single_pct: 0.05
    min_listed_days: 120
    min_price: 5.0
    min_turnover: 1000.0
    momentum_lookback: 20
    rebalance_days: 20
    stop_loss_pct: 0.2
    cash_reserve_pct: 0.05
    top_k: 50
    value_metric: pe_ttm
    volatility_lookback: 60
    weight_momentum: 0.2
    weight_quality: 0.2
    weight_size: 0.15
    weight_value: 0.25
    weight_volatility: 0.2
trading_rules:
  allow_short: false
  lot_size: 100
  t_plus: 1
universe_policy:
  auto_exclude:
  - ST
  - DELISTING
  - SUSPENDED_LONG
  base_index: 000300.SH
  manual_exclude_list: configs/universe/exclude_list.yml
  name: multifactor_enhance
