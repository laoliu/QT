# R122 四组件跨资产组合 — ML1000 降权方案 A
# ====================================================================
# 基于 R121-A3a ML1000 Alpha 衰减诊断结论:
#   - CSI1000 decay_ratio=0.265 (74% SR衰减)
#   - IC_std 翻倍(0.08→0.17)，ICIR从1.4崩至0.6
#   - 权重敏感度分析推荐: ML1000 15%→10%, ML2000 35%→40%
#
# 组件权重调整:
#   ┌──────────────────────┬──────┬──────┬──────────────────┐
#   │ 组件                  │ R116 │ R122 │ 调整理由          │
#   ├──────────────────────┼──────┼──────┼──────────────────┤
#   │ ML CSI2000 Fund       │  35% │  40% │ 无衰减,增配     │
#   │ ML CSI1000 Fund       │  15% │  10% │ 74%衰减,减配    │
#   │ CB Stock Quality      │  25% │  25% │ 维持             │
#   │ ETF Cross V6 FAA      │  25% │  25% │ 维持             │
#   └──────────────────────┴──────┴──────┴──────────────────┘
# 敏感度: 全量AR 23.1%→21.7%(-1.4pp), 近3年AR 15.7%→16.6%(+0.9pp)
# ====================================================================
# 运行: python scripts/ops/r116_paper_daily.py --config configs/paper/r122_combo.yml
# ====================================================================

profile_name: "r122_combo"
description: >
  R122 四组件跨资产组合 — ML1000降权方案A
  基于R121-A3a ML1000衰减诊断, ML2000:40/ML1000:10/CB:25/ETF:25

initial_capital: 10000000.0

# ── 组合权重 (R122: ML1000 降权) ──
portfolio_weights:
  ml_csi2000: 0.40
  ml_csi1000: 0.10
  cb: 0.25
  etf: 0.25

# ── ML CSI2000 Fund 配置 (与R116一致) ──
ml_csi2000:
  asset_type: "a_stock"
  model_dir: "models/ml_csi2000_lgb_fund"
  universe: "csi2000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── ML CSI1000 Fund 配置 (权重降至10%) ──
ml_csi1000:
  asset_type: "a_stock"
  model_dir: "models/ml_csi1000_lgb_fund"
  universe: "csi1000"
  top_k: 50
  rebalance_freq: "every_5d"
  max_industry_pct: 0.15
  max_stock_pct: 0.03
  vol_target: 0.20
  vol_lookback: 60
  lot_size: 100
  commission_rate: 0.0000854
  commission_min: 5.0
  stamp_tax_sell: 0.0005
  transfer_fee: 0.00001
  slippage_bps: 5.0

# ── CB Stock Quality 配置 (与R116一致) ──
cb:
  asset_type: "convertible_bond"
  top_k: 10
  rebalance_freq: "daily"
  max_price: 145.0
  max_issue_size: 20000.0
  min_turnover: 20.0
  max_premium: 60.0
  min_age_days: 3
  min_days_to_maturity: 30
  factor_weights:
    price: 0.18
    premium: 0.12
    stock_roe: 0.25
    stock_ep: 0.20
    stock_vol: 0.15
    issue_size: 0.10
  lot_size: 10
  commission_rate: 0.0000854
  commission_min: 5.0
  slippage_bps: 5.0

# ── ETF Cross V6 FAA 配置 (与R116一致) ──
etf:
  asset_type: "etf"
  top_k: 3
  rebalance_freq: "every_10d"
  symbols:
    - "510300.SH"   # 沪深300
    - "510500.SH"   # 中证500
    - "159915.SZ"   # 创业板
    - "512100.SH"   # 中证1000
    - "510050.SH"   # 上证50
    - "510880.SH"   # 红利
    - "512010.SH"   # 医药
    - "512690.SH"   # 酒
    - "512660.SH"   # 军工
    - "513100.SH"   # 纳指
    - "159920.SZ"   # 恒生
    - "518880.SH"   # 黄金
    - "511010.SH"   # 国债

# ── 组合健康监控 (R122:加强ML1000衰减监控) ──
monitoring:
  risk_contribution:
    ml_csi2000_max: 0.55
    ml_csi2000_warn: 0.50
    check_frequency: weekly
  alpha_decay:
    rolling_sr_window: 252
    sr_threshold: 0.0
    max_consecutive_months: 6
    check_frequency: monthly
    # R122新增: 对CSI1000单独设置更严格的监控
    ml_csi1000_sr_threshold: 0.3
    ml_csi1000_warn_months: 3
  drawdown:
    warn_level: -0.20
    halt_level: -0.25
  pbo_review:
    max_pbo: 0.50
    min_decay_ratio: 0.25
    check_frequency: quarterly
