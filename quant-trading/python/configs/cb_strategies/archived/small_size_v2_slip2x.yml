# SmallSize v2 — 滑点压力测试 (impact_coeff 2x)
# ============================================================
# 原则C验证: impact_coeff 翻倍后 Sharpe 是否仍 > 1.0
# 基准: impact_coeff=50 → 测试: impact_coeff=100
# ============================================================

name: "small_size_v2_slip2x"
description: "小规模因子轮动策略 v2 — 滑点压力测试 (impact_coeff=100, 2x)"

data:
  source: "tushare_cb"
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  adjust: "none"
  cache_dir: "data/cache/cb_tushare"

strategy:
  name: "small_size"
  params:
    top_k: 4
    rebalance_days: 1
    max_price: 145.0
    max_issue_size: 20000.0
    min_issue_size: 0.0
    min_turnover: 10.0
    min_days_to_maturity: 30
    exclude_st: true
    stop_loss_pct: 0.10
    lot_size: 10

fill_model:
  name: "next_bar_open"
  volume_constraint:
    max_participation_rate: 0.10
    opening_volume_fraction: 0.15
    lot_size: 10

cost:
  commission_rate: 0.0000854  # 13.1 MarketRulesConvertibleBond
  commission_min: 5
  stamp_tax_rate: 0.0
  transfer_fee_rate: 0.0
  slippage_bps: 5.0
  slippage_model: "linear_impact"
  slippage_params:
    base_bps: 5.0
    impact_coeff: 100.0    # 2x (原值 50.0)
    fallback_bps: 8.0
    max_bps: 80.0

risk:
  enabled: true
  max_position_weight: 0.30
  max_drawdown: 0.50

initial_capital: 500000.0
lot_size: 10
